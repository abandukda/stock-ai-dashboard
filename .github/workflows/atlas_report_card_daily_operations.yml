name: ATLAS Report Card Daily Operations

# Two UTC wakes cover 18:30 America/New_York across DST. The preflight rejects
# the non-matching wake. Live operation remains impossible until all repository
# certification variables are true and the kill switch is explicitly released.
on:
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-report-card-daily-ledger-mutation
  cancel-in-progress: false

jobs:
  guarded-wake:
    if: vars.ATLAS_REPORT_CARD_AUTOMATION_ENABLED == 'true'
    environment: atlas-internal-report-card
    runs-on: [self-hosted, Linux, X64, atlas-worker-1]
    timeout-minutes: 30
    env:
      ATLAS_REPORT_CARD_AUTOMATION_ENABLED: ${{ vars.ATLAS_REPORT_CARD_AUTOMATION_ENABLED }}
      ATLAS_REPORT_CARD_KILL_SWITCH: ${{ vars.ATLAS_REPORT_CARD_KILL_SWITCH }}
      ATLAS_REPORT_CARD_AUTOMATION_TOKEN: ${{ secrets.ATLAS_REPORT_CARD_AUTOMATION_TOKEN }}
      PROVIDER_FREE_PLAN_PASS: ${{ vars.ATLAS_REPORT_CARD_PROVIDER_FREE_PLAN_PASS }}
      LIVE_ACQUISITION_PASS: ${{ vars.ATLAS_REPORT_CARD_LIVE_ACQUISITION_PASS }}
      DETERMINISTIC_PRODUCER_PASS: ${{ vars.ATLAS_REPORT_CARD_DETERMINISTIC_PRODUCER_PASS }}
      APPEND_BACKUP_RESTORE_PASS: ${{ vars.ATLAS_REPORT_CARD_APPEND_BACKUP_RESTORE_PASS }}
      SECOND_CYCLE_RELIABILITY_PASS: ${{ vars.ATLAS_REPORT_CARD_SECOND_CYCLE_RELIABILITY_PASS }}
      ATLAS_REPORT_CARD_DURABLE_ROOT: ${{ vars.ATLAS_REPORT_CARD_DURABLE_ROOT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Provider-free scheduler and ledger preflight
        run: >-
          python3 scripts/preflight_report_card_daily_operations.py
          --ledger "$ATLAS_REPORT_CARD_DURABLE_ROOT/report-card.sqlite3"
          --start-date "2026-10-08"
          --as-of "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
          --source-sha "$GITHUB_SHA"
          --output audit_results/report_card_daily/preflight.json
      - name: Enforce disabled-until-certified operating boundary
        run: >-
          python3 -c 'import json; r=json.load(open("audit_results/report_card_daily/preflight.json"));
          assert r["wake_allowed"] is True, r["wake_reason"];
          assert r["provider_calls"] == 0 and r["ledger_invariant"] is True'
      - name: Live operation remains separately gated
        run: |
          echo "::error title=ATLAS daily operation not yet activated::Preflight passed, but the certified live orchestrator activation commit is intentionally absent."
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-report-card-daily-preflight-${{ github.run_id }}
          path: audit_results/report_card_daily
          retention-days: 30
