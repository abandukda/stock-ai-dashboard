name: ATLAS Full QA Certification

on:
  schedule:
    - cron: "15 12 * * 1-5"
  workflow_run:
    workflows: ["Overnight Market Scan"]
    types: [completed]
  workflow_dispatch:
    inputs:
      qa_mode:
        description: "Certification mode (manual runs default to no production mutation)"
        required: true
        default: CERTIFY_ONLY
        type: choice
        options: [CERTIFY_ONLY, CERTIFY_AND_PROMOTE]
      qa_tier:
        description: "QA tier: release smoke for ordinary readiness; exhaustive full for promotion/major release"
        required: true
        default: RELEASE_SMOKE
        type: choice
        options: [RELEASE_SMOKE, RELEASE_FULL, FAST_PREVIEW]
      candidate_run_id:
        description: "Overnight run ID, publication:<run ID>, or qa:<run ID>; blank generates"
        required: false
        type: string
      allow_rollback:
        description: "Explicitly authorize an older candidate (requires exact run/SHA and reason)"
        required: false
        default: false
        type: boolean
      rollback_reason:
        description: "Auditable reason for an explicit rollback"
        required: false
        type: string
      target_candidate_run_id:
        description: "Exact rollback target candidate run ID"
        required: false
        type: string
      target_candidate_sha:
        description: "Exact rollback target source SHA"
        required: false
        type: string
      idempotent_reason:
        description: "Required reason when intentionally re-promoting identical bytes"
        required: false
        type: string
  workflow_call:
    inputs:
      qa_mode:
        required: false
        default: CERTIFY_ONLY
        type: string
      qa_tier:
        required: false
        default: RELEASE_FULL
        type: string
      candidate_run_id:
        description: "Overnight run ID, publication:<run ID>, or qa:<run ID>; blank generates"
        required: false
        type: string
      allow_rollback:
        required: false
        default: false
        type: boolean
      rollback_reason:
        required: false
        type: string
      target_candidate_run_id:
        required: false
        type: string
      target_candidate_sha:
        required: false
        type: string
      idempotent_reason:
        required: false
        type: string
    secrets:
      TWELVE_DATA_API_KEY:
        required: false
      FINNHUB_API_KEY:
        required: false
      NEWSAPI_KEY:
        required: false
      ALPHA_VANTAGE_API_KEY:
        required: false
      SEC_USER_AGENT:
        required: false
      ATLAS_AUDIT_PASSWORD:
        required: false

permissions:
  actions: read
  contents: write

concurrency:
  group: atlas-production-publication
  cancel-in-progress: false

jobs:
  backend-certification:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      candidate_kind: ${{ steps.candidate.outputs.candidate_kind }}
      candidate_run_id: ${{ steps.candidate.outputs.run_id }}
      qa_mode: ${{ steps.mode.outputs.qa_mode }}
      qa_tier: ${{ steps.tier.outputs.qa_tier }}
    env:
      ATLAS_DATA_MODE: INTERNAL_TRIAL
      TWELVE_DATA_ENABLED: "true"
      ATLAS_HARD_PUBLICATION_GOVERNANCE_ENABLED: "true"
      ATLAS_FOUNDER_GUIDANCE_V1_ENABLED: "true"
      ATLAS_QA_READINESS_TIMEOUT_SECONDS: "180"
      ATLAS_PUBLICATION_OUTPUT_MODE: CANDIDATE
      ATLAS_CANDIDATE_OUTPUT_DIR: audit_results/candidate_artifacts
      DATA_DIR: "."
      PYTHONPATH: "."
      FAST_CRON_MODE: "true"
      FAST_CRON_SKIP_PRE_RANK_DEEP_APIS: "true"
      FULL_COMMITTEE_LIMIT: "15"
      ETF_FULL_COMMITTEE_LIMIT: "10"
      HTTP_TIMEOUT_FAST: "6"
      # Certification run tests every requested pool size up to these maxima.
      DISCOVERY_CANDIDATE_POOL_SIZE: "1500"
      FULL_EVALUATION_POOL_SIZE: "1400"
      DISCOVERY_VALIDATION_NEAR_CUTOFF: "100"
      DISCOVERY_VALIDATION_RANDOM: "100"
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

    steps:
      - name: Checkout current production main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install certification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install XlsxWriter==3.2.9

      - name: Enforce governed-provider boundary
        run: python scripts/audit_production_yahoo_dependencies.py

      - name: Resolve candidate run
        id: candidate
        env:
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          candidate_run_id="${WORKFLOW_RUN_ID:-${DISPATCH_RUN_ID:-}}"
          if [[ "$candidate_run_id" == qa:* ]]; then
            echo "candidate_kind=qa" >> "$GITHUB_OUTPUT"
            candidate_run_id="${candidate_run_id#qa:}"
          elif [[ "$candidate_run_id" == publication:* ]]; then
            echo "candidate_kind=publication" >> "$GITHUB_OUTPUT"
            candidate_run_id="${candidate_run_id#publication:}"
            if ! [[ "$candidate_run_id" =~ ^[0-9]+$ ]]; then
              echo "::error::Publication recovery run ID must be numeric"
              exit 1
            fi
          else
            echo "candidate_kind=overnight" >> "$GITHUB_OUTPUT"
          fi
          echo "run_id=${candidate_run_id}" >> "$GITHUB_OUTPUT"

      - name: Resolve certification mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.qa_mode }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            qa_mode="CERTIFY_AND_PROMOTE"
            chained_run_id="${{ github.event.workflow_run.id }}"
          else
            qa_mode="${REQUESTED_MODE:-CERTIFY_ONLY}"
            chained_run_id=""
          fi
          echo "qa_mode=$qa_mode" >> "$GITHUB_OUTPUT"
          echo "chained_run_id=$chained_run_id" >> "$GITHUB_OUTPUT"
          echo "QA mode: $qa_mode"

      - name: Resolve bounded QA tier
        id: tier
        env:
          REQUESTED_TIER: ${{ inputs.qa_tier }}
          QA_MODE: ${{ steps.mode.outputs.qa_mode }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            qa_tier="RELEASE_FULL"
          else
            qa_tier="${REQUESTED_TIER:-RELEASE_SMOKE}"
          fi
          python - "$qa_tier" "$QA_MODE" <<'PY'
          import sys
          from services.full_qa_pipeline import validate_tier
          validate_tier(sys.argv[1], promotion_requested=sys.argv[2] == "CERTIFY_AND_PROMOTE")
          PY
          echo "qa_tier=$qa_tier" >> "$GITHUB_OUTPUT"
          echo "QA tier: $qa_tier"

      - name: Download exact overnight candidate
        if: steps.candidate.outputs.run_id != '' && steps.candidate.outputs.candidate_kind == 'overnight'
        uses: actions/download-artifact@v4
        with:
          name: atlas-scan-candidate-${{ steps.candidate.outputs.run_id }}
          path: audit_results/candidate_artifacts
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Reuse exact candidate from prior QA attempt
        if: steps.candidate.outputs.run_id != '' && steps.candidate.outputs.candidate_kind == 'qa'
        uses: actions/download-artifact@v4
        with:
          name: atlas-full-qa-${{ steps.candidate.outputs.run_id }}
          path: .
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download certified publication-recovery artifact
        if: steps.candidate.outputs.run_id != '' && steps.candidate.outputs.candidate_kind == 'publication'
        uses: actions/download-artifact@v7
        with:
          name: atlas-finnhub-publication-only-recovered-${{ steps.candidate.outputs.run_id }}
          path: audit_results/publication_recovery_input
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Materialize certified publication bundle for full certification
        if: steps.candidate.outputs.run_id != '' && steps.candidate.outputs.candidate_kind == 'publication'
        shell: bash
        run: |
          mapfile -t manifests < <(find audit_results/publication_recovery_input -type f -name publication_manifest.json -print)
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one recovered publication manifest; found ${#manifests[@]}"
            printf '%s\n' "${manifests[@]}"
            exit 1
          fi
          bundle=$(dirname "${manifests[0]}")
          test -r "$bundle/publication_manifest.json"
          test ! -e audit_results/candidate_artifacts
          mv "$bundle" audit_results/candidate_artifacts
          echo "Materialized immutable recovered publication bundle from run ${{ steps.candidate.outputs.run_id }}"

      - name: Verify candidate-generation credential contract
        if: steps.candidate.outputs.run_id == ''
        run: |
          if [ -z "${TWELVE_DATA_API_KEY:-}" ]; then
            echo "::error::INTERNAL_TRIAL candidate generation requires TWELVE_DATA_API_KEY"
            exit 1
          fi

      - name: Generate exact candidate for direct invocation
        if: steps.candidate.outputs.run_id == ''
        run: python overnight_market_scan.py

      - name: Preview candidate relationship and promotion eligibility
        id: identity
        env:
          QA_MODE: ${{ steps.mode.outputs.qa_mode }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback || false }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
          TARGET_RUN_ID: ${{ inputs.target_candidate_run_id }}
          TARGET_SHA: ${{ inputs.target_candidate_sha }}
          IDEMPOTENT_REASON: ${{ inputs.idempotent_reason }}
          CHAINED_RUN_ID: ${{ steps.mode.outputs.chained_run_id }}
        run: |
          mkdir -p audit_results/full_qa/${{ github.run_id }}
          args=(
            --candidate-manifest audit_results/candidate_artifacts/publication_manifest.json
            --production-manifest publication_manifest.json
            --qa-mode "$QA_MODE"
            --rollback-reason "$ROLLBACK_REASON"
            --target-candidate-run-id "$TARGET_RUN_ID"
            --target-candidate-sha "$TARGET_SHA"
            --idempotent-reason "$IDEMPOTENT_REASON"
            --chained-candidate-run-id "$CHAINED_RUN_ID"
            --output audit_results/full_qa/${{ github.run_id }}/promotion_preview.json
          )
          if [[ "$ALLOW_ROLLBACK" == "true" ]]; then args+=(--allow-rollback); fi
          python -m services.promotion_safety "${args[@]}"

      - name: Verify exact candidate identity and digests
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.run_full_qa_certification import _read, verify_candidate_bounded
          candidate = Path("audit_results/candidate_artifacts")
          manifest = _read(candidate / "publication_manifest.json")
          publication_recovery = os.environ.get("CANDIDATE_KIND") == "publication"
          result = verify_candidate_bounded(
              candidate,
              manifest,
              expected_candidate_digest=("96936e2b03af129c586ef2043a517068156449a8d1b8dc3d83618451ec90e77f" if publication_recovery else None),
              expected_publication_digest=("b4b3f66959e497c957472da2626c6e0c3e63dc29cef175c195aca48a9f1126c6" if publication_recovery else None),
              expected_source_sha=("d5526664b1b4450e67b63a67b01d936f6da5a2a4" if publication_recovery else None),
          )
          required = manifest.get("source_commit_sha") or manifest.get("source_sha")
          if not required:
              raise SystemExit("CANDIDATE_SOURCE_SHA_MISSING")
          verification = {"status": "PASS", "candidate_run_id": manifest.get("run_id"),
                          "candidate_source_sha": required, "source_sha": result["source_sha"],
                          "candidate_generated_at": manifest.get("generated_at"),
                          "candidate_digest": result["candidate_digest"],
                          "publication_digest": result["publication_digest"],
                          "peak_rss_mib": result["peak_rss_mib"]}
          output = Path("audit_results/full_qa") / os.environ["GITHUB_RUN_ID"] / "candidate_verification.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(verification, indent=2, sort_keys=True), encoding="utf-8")
          print(json.dumps(verification, sort_keys=True))
          PY
        env:
          CANDIDATE_KIND: ${{ steps.candidate.outputs.candidate_kind }}

      - name: Run dataset and numerical certification
        id: data_qa
        continue-on-error: true
        run: |
          python scripts/run_full_qa_certification.py \
            --candidate-dir audit_results/candidate_artifacts \
            --production-dir . \
            --output-dir audit_results/full_qa/${{ github.run_id }} \
            --artifact-link https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Emit fail-fast deterministic blocker bundle
        if: steps.data_qa.outcome == 'failure'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from services.full_qa_pipeline import TimingReport, write_early_blocker_bundle
          root = Path("audit_results/full_qa") / os.environ["GITHUB_RUN_ID"]
          reports = sorted(root.glob("ATLAS_MASTER_QA_*.json"))
          report = json.loads(reports[-1].read_text()) if reports else {}
          findings = [row for row in ((report.get("sheets") or {}).get("Validation_Failures") or [])
                      if row.get("severity") in {"P0", "P1", "P2"}]
          manifest = json.loads(Path("audit_results/candidate_artifacts/publication_manifest.json").read_text())
          write_early_blocker_bundle(root, candidate={"run_id": manifest.get("run_id"),
              "source_sha": manifest.get("source_commit_sha") or manifest.get("source_sha")},
              findings=findings or [{"severity": "P1", "reason": "DETERMINISTIC_CERTIFICATION_FAILED"}],
              timing=TimingReport())
          PY

      - name: Build governed backend certification handoff
        if: steps.data_qa.outcome == 'success'
        run: |
          python scripts/full_qa_split_handoff.py backend \
            --verification audit_results/full_qa/${{ github.run_id }}/candidate_verification.json \
            --qa-dir audit_results/full_qa/${{ github.run_id }} \
            --candidate-run-id "${{ steps.candidate.outputs.run_id || github.run_id }}" \
            --release-sha "${{ github.sha }}" \
            --output audit_results/full_qa/${{ github.run_id }}/backend_handoff.json

      - name: Upload governed backend certification handoff
        if: steps.data_qa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-release-full-backend-${{ github.run_id }}
          path: |
            audit_results/full_qa/${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce fail-fast deterministic result
        if: always() && steps.data_qa.outcome == 'failure'
        run: |
          echo "::error::FULL QA BLOCKED BEFORE VISUAL CRAWL"
          exit 1

      - name: Preserve exact generated candidate for deterministic reruns
        if: always() && steps.candidate.outputs.run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: atlas-scan-candidate-${{ github.run_id }}
          path: audit_results/candidate_artifacts
          if-no-files-found: warn
          retention-days: 14

  visual-certification:
    needs: backend-certification
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    env:
      PYTHONPATH: "."
      DATA_DIR: audit_results/full_qa/runtime
      ATLAS_EXACT_CANDIDATE_QA: "true"
      ATLAS_QA_TIER: ${{ needs.backend-certification.outputs.qa_tier }}
      ATLAS_QA_RUNTIME_CEILING_SECONDS: "5400"
      ATLAS_AUDIT_PASSWORD: ${{ secrets.ATLAS_AUDIT_PASSWORD }}
      GUEST_PASSWORD: ${{ secrets.ATLAS_AUDIT_PASSWORD }}
      EXPECTED_CANDIDATE_DIGEST: "96936e2b03af129c586ef2043a517068156449a8d1b8dc3d83618451ec90e77f"
      EXPECTED_PUBLICATION_DIGEST: "b4b3f66959e497c957472da2626c6e0c3e63dc29cef175c195aca48a9f1126c6"
      EXPECTED_ANALYTICAL_SOURCE_SHA: "d5526664b1b4450e67b63a67b01d936f6da5a2a4"
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Self-hosted visual runner preflight
        run: |
          test "${{ runner.name }}" = "atlas-worker-1"
          uname -a
          free -h
          df -h .
          ! pgrep -af '[s]treamlit run app.py'
          if pgrep -af '[c]hrome|[c]hromium'; then
            pkill -TERM -f '[c]hrome' || true
            pkill -TERM -f '[c]hromium' || true
            sleep 2
          fi
          ! ss -ltn '( sport = :8501 )' | grep -q LISTEN

      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: Install visual certification dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.52.0
          python -m playwright install chromium

      - name: Download governed backend handoff
        uses: actions/download-artifact@v4
        with:
          name: atlas-release-full-backend-${{ github.run_id }}
          path: audit_results/full_qa/backend

      - name: Download exact certified publication artifact
        if: needs.backend-certification.outputs.candidate_kind == 'publication'
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.backend-certification.outputs.candidate_run_id }}
          name: atlas-finnhub-publication-only-recovered-${{ needs.backend-certification.outputs.candidate_run_id }}
          path: audit_results/full_qa/publication_input

      - name: Resolve exact publication bundle
        id: bundle
        if: needs.backend-certification.outputs.candidate_kind == 'publication'
        shell: bash
        run: |
          mapfile -t manifests < <(find audit_results/full_qa/publication_input -type f -name publication_manifest.json -print)
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one recovered publication manifest; found ${#manifests[@]}"
            exit 1
          fi
          bundle=$(dirname "${manifests[0]}")
          report_root=$(dirname "$bundle")
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "report_root=$report_root" >> "$GITHUB_OUTPUT"

      - name: Verify identity and build bounded visual runtime
        if: needs.backend-certification.outputs.candidate_kind == 'publication'
        run: |
          mkdir -p audit_results/full_qa/visual
          /usr/bin/time -v -o audit_results/full_qa/visual/runtime_projection_memory.txt \
            python scripts/run_bounded_release_smoke.py \
              --bundle "${{ steps.bundle.outputs.bundle }}" \
              --report-root "${{ steps.bundle.outputs.report_root }}" \
              --runtime-dir audit_results/full_qa/runtime \
              --output audit_results/full_qa/visual/candidate_verification.json \
              --expected-candidate-digest "$EXPECTED_CANDIDATE_DIGEST" \
              --expected-publication-digest "$EXPECTED_PUBLICATION_DIGEST" \
              --expected-source-sha "$EXPECTED_ANALYTICAL_SOURCE_SHA"

      - name: Verify production Python grammar
        run: python -m compileall -q app.py ui services engines agents scripts

      - name: Launch exact-candidate Streamlit runtime
        run: |
          log=audit_results/full_qa/visual/streamlit.log
          memory=audit_results/full_qa/visual/streamlit_memory.txt
          /usr/bin/time -v -o "$memory" python -m streamlit run app.py \
            --server.headless true --server.address 127.0.0.1 --server.port 8501 > "$log" 2>&1 &
          echo $! > audit_results/full_qa/visual/streamlit.pid
          for attempt in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8501/_stcore/health && exit 0
            sleep 1
          done
          cat "$log"
          exit 1

      - name: Capture and validate RELEASE_FULL desktop/mobile customer surfaces
        id: visual_qa
        run: |
          /usr/bin/time -v -o audit_results/full_qa/visual/crawler_memory.txt \
            python -m agents.full_qa_visual_certification \
              --url http://127.0.0.1:8501 \
              --root audit_results/full_qa/runtime \
              --candidate-dir "${{ steps.bundle.outputs.bundle }}" \
              --candidate-run-id "${{ needs.backend-certification.outputs.candidate_run_id }}" \
              --mode RELEASE_FULL \
              --runtime-ceiling-seconds 5400 \
              --output audit_results/full_qa/visual/results

      - name: Build governed visual certification handoff
        run: |
          python scripts/full_qa_split_handoff.py visual \
            --backend audit_results/full_qa/backend/backend_handoff.json \
            --verification audit_results/full_qa/visual/candidate_verification.json \
            --visual-summary audit_results/full_qa/visual/results/atlas_full_qa_visual_summary.json \
            --screenshot-manifest audit_results/full_qa/visual/results/visual_manifest.json \
            --output audit_results/full_qa/visual/visual_handoff.json

      - name: Upload autonomous visual certification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-release-full-visual-${{ github.run_id }}
          path: audit_results/full_qa/visual
          if-no-files-found: error
          retention-days: 90

      - name: Clean up Streamlit and Chromium
        if: always()
        run: |
          if [ -f audit_results/full_qa/visual/streamlit.pid ]; then
            kill "$(cat audit_results/full_qa/visual/streamlit.pid)" 2>/dev/null || true
          fi
          pkill -TERM -f '[s]treamlit run app.py' 2>/dev/null || true
          pkill -TERM -f '[c]hrome' 2>/dev/null || true
          pkill -TERM -f '[c]hromium' 2>/dev/null || true

  finalization:
    needs: [backend-certification, visual-certification]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: "3.11"}

      - name: Download backend certification handoff
        uses: actions/download-artifact@v4
        with:
          name: atlas-release-full-backend-${{ github.run_id }}
          path: audit_results/full_qa/backend

      - name: Download visual certification handoff
        uses: actions/download-artifact@v4
        with:
          name: atlas-release-full-visual-${{ github.run_id }}
          path: audit_results/full_qa/visual

      - name: Combine fail-closed RELEASE_FULL certification
        run: |
          python scripts/full_qa_split_handoff.py finalize \
            --backend audit_results/full_qa/backend/backend_handoff.json \
            --visual audit_results/full_qa/visual/visual_handoff.json \
            --output audit_results/full_qa/final/release_full_certification.json

      - name: Upload combined RELEASE_FULL certification
        uses: actions/upload-artifact@v4
        with:
          name: atlas-full-qa-${{ github.run_id }}
          path: audit_results/full_qa
          if-no-files-found: error
          retention-days: 90
