name: ATLAS Full QA Certification

on:
  schedule:
    - cron: "15 12 * * 1-5"
  workflow_run:
    workflows: ["Overnight Market Scan"]
    types: [completed]
  workflow_dispatch:
    inputs:
      qa_mode:
        description: "Certification mode (manual runs default to no production mutation)"
        required: true
        default: CERTIFY_ONLY
        type: choice
        options: [CERTIFY_ONLY, CERTIFY_AND_PROMOTE]
      qa_tier:
        description: "Visual QA tier (FAST_PREVIEW never authorizes promotion)"
        required: true
        default: FAST_PREVIEW
        type: choice
        options: [FAST_PREVIEW, RELEASE_FULL]
      candidate_run_id:
        description: "Overnight run ID, or qa:<run ID> to reuse a QA candidate; blank generates"
        required: false
        type: string
      allow_rollback:
        description: "Explicitly authorize an older candidate (requires exact run/SHA and reason)"
        required: false
        default: false
        type: boolean
      rollback_reason:
        description: "Auditable reason for an explicit rollback"
        required: false
        type: string
      target_candidate_run_id:
        description: "Exact rollback target candidate run ID"
        required: false
        type: string
      target_candidate_sha:
        description: "Exact rollback target source SHA"
        required: false
        type: string
      idempotent_reason:
        description: "Required reason when intentionally re-promoting identical bytes"
        required: false
        type: string
  workflow_call:
    inputs:
      qa_mode:
        required: false
        default: CERTIFY_ONLY
        type: string
      qa_tier:
        required: false
        default: RELEASE_FULL
        type: string
      candidate_run_id:
        description: "Overnight run ID, or qa:<run ID> to reuse a QA candidate; blank generates"
        required: false
        type: string
      allow_rollback:
        required: false
        default: false
        type: boolean
      rollback_reason:
        required: false
        type: string
      target_candidate_run_id:
        required: false
        type: string
      target_candidate_sha:
        required: false
        type: string
      idempotent_reason:
        required: false
        type: string
    secrets:
      TWELVE_DATA_API_KEY:
        required: false
      FMP_API_KEY:
        required: false
      FINNHUB_API_KEY:
        required: false
      NEWSAPI_KEY:
        required: false
      ALPHA_VANTAGE_API_KEY:
        required: false
      SEC_USER_AGENT:
        required: false
      ATLAS_AUDIT_PASSWORD:
        required: false

permissions:
  actions: read
  contents: write

concurrency:
  group: atlas-production-publication
  cancel-in-progress: false

jobs:
  certify-and-promote:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ATLAS_DATA_MODE: INTERNAL_TRIAL
      TWELVE_DATA_ENABLED: "true"
      ATLAS_HARD_PUBLICATION_GOVERNANCE_ENABLED: "true"
      ATLAS_FOUNDER_GUIDANCE_V1_ENABLED: "true"
      ATLAS_QA_READINESS_TIMEOUT_SECONDS: "180"
      ATLAS_PUBLICATION_OUTPUT_MODE: CANDIDATE
      ATLAS_CANDIDATE_OUTPUT_DIR: audit_results/candidate_artifacts
      DATA_DIR: "."
      PYTHONPATH: "."
      FAST_CRON_MODE: "true"
      FAST_CRON_SKIP_PRE_RANK_DEEP_APIS: "true"
      FULL_COMMITTEE_LIMIT: "15"
      ETF_FULL_COMMITTEE_LIMIT: "10"
      HTTP_TIMEOUT_FAST: "6"
      # Certification run tests every requested pool size up to these maxima.
      DISCOVERY_CANDIDATE_POOL_SIZE: "1500"
      FULL_EVALUATION_POOL_SIZE: "1400"
      DISCOVERY_VALIDATION_NEAR_CUTOFF: "100"
      DISCOVERY_VALIDATION_RANDOM: "100"
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

    steps:
      - name: Checkout current production main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install certification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright==1.52.0
          pip install XlsxWriter==3.2.9
          python -m playwright install --with-deps chromium

      - name: Enforce governed-provider boundary
        run: python scripts/audit_production_yahoo_dependencies.py

      - name: Resolve candidate run
        id: candidate
        env:
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          candidate_run_id="${WORKFLOW_RUN_ID:-${DISPATCH_RUN_ID:-}}"
          if [[ "$candidate_run_id" == qa:* ]]; then
            echo "candidate_kind=qa" >> "$GITHUB_OUTPUT"
            candidate_run_id="${candidate_run_id#qa:}"
          else
            echo "candidate_kind=overnight" >> "$GITHUB_OUTPUT"
          fi
          echo "run_id=${candidate_run_id}" >> "$GITHUB_OUTPUT"

      - name: Resolve certification mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.qa_mode }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            qa_mode="CERTIFY_AND_PROMOTE"
            chained_run_id="${{ github.event.workflow_run.id }}"
          else
            qa_mode="${REQUESTED_MODE:-CERTIFY_ONLY}"
            chained_run_id=""
          fi
          echo "qa_mode=$qa_mode" >> "$GITHUB_OUTPUT"
          echo "chained_run_id=$chained_run_id" >> "$GITHUB_OUTPUT"
          echo "QA mode: $qa_mode"

      - name: Resolve bounded QA tier
        id: tier
        env:
          REQUESTED_TIER: ${{ inputs.qa_tier }}
          QA_MODE: ${{ steps.mode.outputs.qa_mode }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            qa_tier="RELEASE_FULL"
          else
            qa_tier="${REQUESTED_TIER:-FAST_PREVIEW}"
          fi
          python - "$qa_tier" "$QA_MODE" <<'PY'
          import sys
          from services.full_qa_pipeline import validate_tier
          validate_tier(sys.argv[1], promotion_requested=sys.argv[2] == "CERTIFY_AND_PROMOTE")
          PY
          echo "qa_tier=$qa_tier" >> "$GITHUB_OUTPUT"
          echo "QA tier: $qa_tier"

      - name: Download exact overnight candidate
        if: steps.candidate.outputs.run_id != '' && steps.candidate.outputs.candidate_kind == 'overnight'
        uses: actions/download-artifact@v4
        with:
          name: atlas-scan-candidate-${{ steps.candidate.outputs.run_id }}
          path: audit_results/candidate_artifacts
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Reuse exact candidate from prior QA attempt
        if: steps.candidate.outputs.run_id != '' && steps.candidate.outputs.candidate_kind == 'qa'
        uses: actions/download-artifact@v4
        with:
          name: atlas-full-qa-${{ steps.candidate.outputs.run_id }}
          path: .
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify candidate-generation credential contract
        if: steps.candidate.outputs.run_id == ''
        run: |
          if [ -z "${TWELVE_DATA_API_KEY:-}" ]; then
            echo "::error::INTERNAL_TRIAL candidate generation requires TWELVE_DATA_API_KEY"
            exit 1
          fi

      - name: Generate exact candidate for direct invocation
        if: steps.candidate.outputs.run_id == ''
        run: python overnight_market_scan.py

      - name: Preview candidate relationship and promotion eligibility
        id: identity
        env:
          QA_MODE: ${{ steps.mode.outputs.qa_mode }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback || false }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
          TARGET_RUN_ID: ${{ inputs.target_candidate_run_id }}
          TARGET_SHA: ${{ inputs.target_candidate_sha }}
          IDEMPOTENT_REASON: ${{ inputs.idempotent_reason }}
          CHAINED_RUN_ID: ${{ steps.mode.outputs.chained_run_id }}
        run: |
          mkdir -p audit_results/full_qa/${{ github.run_id }}
          args=(
            --candidate-manifest audit_results/candidate_artifacts/publication_manifest.json
            --production-manifest publication_manifest.json
            --qa-mode "$QA_MODE"
            --rollback-reason "$ROLLBACK_REASON"
            --target-candidate-run-id "$TARGET_RUN_ID"
            --target-candidate-sha "$TARGET_SHA"
            --idempotent-reason "$IDEMPOTENT_REASON"
            --chained-candidate-run-id "$CHAINED_RUN_ID"
            --output audit_results/full_qa/${{ github.run_id }}/promotion_preview.json
          )
          if [[ "$ALLOW_ROLLBACK" == "true" ]]; then args+=(--allow-rollback); fi
          python -m services.promotion_safety "${args[@]}"

      - name: Verify exact candidate identity and digests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.run_full_qa_certification import _read, _verify_candidate, ARTIFACT_NAMES
          candidate = Path("audit_results/candidate_artifacts")
          manifest = _read(candidate / "publication_manifest.json")
          payloads = {Path(name): _read(candidate / name) for name in ARTIFACT_NAMES}
          _verify_candidate(candidate, manifest, payloads)
          required = manifest.get("source_commit_sha") or manifest.get("source_sha")
          if not required:
              raise SystemExit("CANDIDATE_SOURCE_SHA_MISSING")
          print(json.dumps({"candidate_run_id": manifest.get("run_id"), "candidate_source_sha": required,
                            "candidate_generated_at": manifest.get("generated_at")}, sort_keys=True))
          PY

      - name: Run dataset and numerical certification
        id: data_qa
        continue-on-error: true
        run: |
          python scripts/run_full_qa_certification.py \
            --candidate-dir audit_results/candidate_artifacts \
            --production-dir . \
            --output-dir audit_results/full_qa/${{ github.run_id }} \
            --artifact-link https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Emit fail-fast deterministic blocker bundle
        if: steps.data_qa.outcome == 'failure'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from services.full_qa_pipeline import TimingReport, write_early_blocker_bundle
          root = Path("audit_results/full_qa") / os.environ["GITHUB_RUN_ID"]
          reports = sorted(root.glob("ATLAS_MASTER_QA_*.json"))
          report = json.loads(reports[-1].read_text()) if reports else {}
          findings = [row for row in ((report.get("sheets") or {}).get("Validation_Failures") or [])
                      if row.get("severity") in {"P0", "P1", "P2"}]
          manifest = json.loads(Path("audit_results/candidate_artifacts/publication_manifest.json").read_text())
          write_early_blocker_bundle(root, candidate={"run_id": manifest.get("run_id"),
              "source_sha": manifest.get("source_commit_sha") or manifest.get("source_sha")},
              findings=findings or [{"severity": "P1", "reason": "DETERMINISTIC_CERTIFICATION_FAILED"}],
              timing=TimingReport())
          PY

      - name: Materialize exact candidate for customer-surface QA
        if: steps.data_qa.outcome == 'success'
        run: |
          cp audit_results/candidate_artifacts/market_full_scan.json market_full_scan.json
          cp audit_results/candidate_artifacts/market_prescreen.json market_prescreen.json
          cp audit_results/candidate_artifacts/recovery_scan.json recovery_scan.json
          cp audit_results/candidate_artifacts/etf_scan.json etf_scan.json
          cp audit_results/candidate_artifacts/total_market_universe.json total_market_universe.json
          cp audit_results/candidate_artifacts/market_scan_state.json market_scan_state.json
          cp audit_results/candidate_artifacts/discovery_candidate_pool.json discovery_candidate_pool.json
          cp audit_results/candidate_artifacts/full_evaluation_pool.json full_evaluation_pool.json

      - name: Verify production Python grammar
        if: steps.data_qa.outcome == 'success'
        run: python -m compileall -q app.py ui services engines agents scripts

      - name: Launch exact-candidate Streamlit runtime
        if: steps.data_qa.outcome == 'success'
        env:
          ATLAS_AUDIT_PASSWORD: ${{ secrets.ATLAS_AUDIT_PASSWORD }}
          GUEST_PASSWORD: ${{ secrets.ATLAS_AUDIT_PASSWORD }}
        run: |
          mkdir -p audit_results/full_qa/${{ github.run_id }}
          python -m streamlit run app.py --server.headless true --server.port 8501 > audit_results/full_qa/${{ github.run_id }}/streamlit.log 2>&1 &
          echo $! > audit_results/full_qa/${{ github.run_id }}/streamlit.pid
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8501/_stcore/health && exit 0
            sleep 1
          done
          exit 1

      - name: Capture and validate desktop/mobile customer surfaces
        if: steps.data_qa.outcome == 'success'
        id: visual_qa
        continue-on-error: true
        env:
          ATLAS_AUDIT_PASSWORD: ${{ secrets.ATLAS_AUDIT_PASSWORD }}
          ATLAS_EXACT_CANDIDATE_QA: "true"
          ATLAS_QA_TIER: ${{ steps.tier.outputs.qa_tier }}
          ATLAS_QA_RUNTIME_CEILING_SECONDS: "5400"
        run: |
          python -m agents.full_qa_visual_certification \
            --url http://127.0.0.1:8501 \
            --root . \
            --candidate-dir audit_results/candidate_artifacts \
            --candidate-run-id "${{ steps.candidate.outputs.run_id || github.run_id }}" \
            --mode "${{ steps.tier.outputs.qa_tier }}" \
            --runtime-ceiling-seconds 5400 \
            --output audit_results/full_qa/${{ github.run_id }}/visual

      - name: Emit sanitized local runtime diagnostics
        if: steps.visual_qa.outcome == 'failure'
        run: |
          tail -200 audit_results/full_qa/${{ github.run_id }}/streamlit.log || true
          cat audit_results/full_qa/${{ github.run_id }}/visual/deployed_readiness.json || true

      - name: Finalize certification and promote atomically
        if: steps.data_qa.outcome == 'success'
        id: qa
        env:
          QA_MODE: ${{ steps.mode.outputs.qa_mode }}
          ALLOW_ROLLBACK: ${{ inputs.allow_rollback || false }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
          TARGET_RUN_ID: ${{ inputs.target_candidate_run_id }}
          TARGET_SHA: ${{ inputs.target_candidate_sha }}
          IDEMPOTENT_REASON: ${{ inputs.idempotent_reason }}
          CHAINED_RUN_ID: ${{ steps.mode.outputs.chained_run_id }}
        run: |
          args=(
            --candidate-dir audit_results/candidate_artifacts
            --production-dir .
            --output-dir audit_results/full_qa/${{ github.run_id }}
            --artifact-link https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            --visual-summary audit_results/full_qa/${{ github.run_id }}/visual/atlas_full_qa_visual_summary.json
            --screenshot-manifest audit_results/full_qa/${{ github.run_id }}/visual/visual_manifest.json
            --qa-mode "$QA_MODE"
            --rollback-reason "$ROLLBACK_REASON"
            --target-candidate-run-id "$TARGET_RUN_ID"
            --target-candidate-sha "$TARGET_SHA"
            --idempotent-reason "$IDEMPOTENT_REASON"
            --chained-candidate-run-id "$CHAINED_RUN_ID"
          )
          if [[ "$ALLOW_ROLLBACK" == "true" ]]; then args+=(--allow-rollback); fi
          python scripts/run_full_qa_certification.py "${args[@]}"
          python - <<'PY'
          import json, os
          path = f"audit_results/full_qa/{os.environ['GITHUB_RUN_ID']}/promotion_result.json"
          result = json.load(open(path, encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"promoted={str(bool(result.get('promoted'))).lower()}\n")
          PY

      - name: Upload QA certification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-full-qa-${{ github.run_id }}
          path: |
            audit_results/full_qa/${{ github.run_id }}
            audit_results/candidate_artifacts
            failed_publication_run.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload autonomous visual certification bundle
        if: always() && steps.data_qa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-visual-qa-${{ github.run_id }}
          path: audit_results/full_qa/${{ github.run_id }}/visual
          if-no-files-found: error
          retention-days: 90

      - name: Enforce fail-fast deterministic result
        if: always() && steps.data_qa.outcome == 'failure'
        run: |
          echo "::error::FULL QA BLOCKED BEFORE VISUAL CRAWL"
          exit 1

      - name: Preserve exact generated candidate for deterministic reruns
        if: always() && steps.candidate.outputs.run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: atlas-scan-candidate-${{ github.run_id }}
          path: audit_results/candidate_artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Commit atomically certified production artifacts
        if: steps.qa.outputs.promoted == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # The 1,500/1,400 diagnostic pools remain in the immutable QA artifact.
          # They are not Streamlit production inputs and can exceed GitHub's
          # per-blob limit after governed evidence enrichment.
          git restore --worktree -- discovery_candidate_pool.json full_evaluation_pool.json
          git add -- etf_scan.json market_full_scan.json market_prescreen.json market_scan_state.json recovery_scan.json total_market_universe.json publication_manifest.json publication_audit.jsonl
          git commit -m "Publish QA-certified overnight market scan - $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No production changes to commit"
          # Visual/runtime QA intentionally creates diagnostics outside the
          # approved release file list. Preserve them in the ephemeral runner
          # while rebasing only the committed production artifacts.
          git pull --rebase --autostash origin main
          # workflow_run checks out the triggering SHA in detached-HEAD mode.
          git push origin HEAD:main
