name: ATLAS Full QA Certification

on:
  schedule:
    - cron: "15 12 * * 1-5"
  workflow_run:
    workflows: ["Overnight Market Scan"]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Overnight run ID, or qa:<run ID> to reuse a QA candidate; blank generates"
        required: false
        type: string
  workflow_call:
    inputs:
      candidate_run_id:
        description: "Overnight run ID, or qa:<run ID> to reuse a QA candidate; blank generates"
        required: false
        type: string
    secrets:
      TWELVE_DATA_API_KEY:
        required: false
      FMP_API_KEY:
        required: false
      FINNHUB_API_KEY:
        required: false
      NEWSAPI_KEY:
        required: false
      ALPHA_VANTAGE_API_KEY:
        required: false
      SEC_USER_AGENT:
        required: false
      ATLAS_AUDIT_PASSWORD:
        required: false

permissions:
  actions: read
  contents: write

concurrency:
  group: atlas-production-publication
  cancel-in-progress: false

jobs:
  certify-and-promote:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ATLAS_DATA_MODE: INTERNAL_TRIAL
      TWELVE_DATA_ENABLED: "true"
      ATLAS_HARD_PUBLICATION_GOVERNANCE_ENABLED: "true"
      ATLAS_FOUNDER_GUIDANCE_V1_ENABLED: "true"
      ATLAS_QA_READINESS_TIMEOUT_SECONDS: "180"
      ATLAS_PUBLICATION_OUTPUT_MODE: CANDIDATE
      ATLAS_CANDIDATE_OUTPUT_DIR: audit_results/candidate_artifacts
      DATA_DIR: "."
      PYTHONPATH: "."
      FAST_CRON_MODE: "true"
      FAST_CRON_SKIP_PRE_RANK_DEEP_APIS: "true"
      FULL_COMMITTEE_LIMIT: "15"
      ETF_FULL_COMMITTEE_LIMIT: "10"
      HTTP_TIMEOUT_FAST: "6"
      # Certification run tests every requested pool size up to these maxima.
      DISCOVERY_CANDIDATE_POOL_SIZE: "1500"
      FULL_EVALUATION_POOL_SIZE: "1250"
      DISCOVERY_VALIDATION_NEAR_CUTOFF: "100"
      DISCOVERY_VALIDATION_RANDOM: "100"
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

    steps:
      - name: Checkout current production main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install certification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright==1.52.0
          pip install XlsxWriter==3.2.9
          python -m playwright install --with-deps chromium

      - name: Resolve candidate run
        id: candidate
        env:
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          candidate_run_id="${WORKFLOW_RUN_ID:-${DISPATCH_RUN_ID:-}}"
          if [[ "$candidate_run_id" == qa:* ]]; then
            echo "candidate_kind=qa" >> "$GITHUB_OUTPUT"
            candidate_run_id="${candidate_run_id#qa:}"
          else
            echo "candidate_kind=overnight" >> "$GITHUB_OUTPUT"
          fi
          echo "run_id=${candidate_run_id}" >> "$GITHUB_OUTPUT"

      - name: Download exact overnight candidate
        if: steps.candidate.outputs.run_id != '' && steps.candidate.outputs.candidate_kind == 'overnight'
        uses: actions/download-artifact@v4
        with:
          name: atlas-scan-candidate-${{ steps.candidate.outputs.run_id }}
          path: audit_results/candidate_artifacts
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Reuse exact candidate from prior QA attempt
        if: steps.candidate.outputs.run_id != '' && steps.candidate.outputs.candidate_kind == 'qa'
        uses: actions/download-artifact@v4
        with:
          name: atlas-full-qa-${{ steps.candidate.outputs.run_id }}
          path: .
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify candidate-generation credential contract
        if: steps.candidate.outputs.run_id == ''
        run: |
          if [ -z "${TWELVE_DATA_API_KEY:-}" ]; then
            echo "::error::INTERNAL_TRIAL candidate generation requires TWELVE_DATA_API_KEY"
            exit 1
          fi

      - name: Generate exact candidate for direct invocation
        if: steps.candidate.outputs.run_id == ''
        run: python overnight_market_scan.py

      - name: Run dataset and numerical certification
        id: data_qa
        continue-on-error: true
        run: |
          python scripts/run_full_qa_certification.py \
            --candidate-dir audit_results/candidate_artifacts \
            --production-dir . \
            --output-dir audit_results/full_qa/${{ github.run_id }} \
            --artifact-link https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Materialize exact candidate for customer-surface QA
        run: |
          cp audit_results/candidate_artifacts/market_full_scan.json market_full_scan.json
          cp audit_results/candidate_artifacts/market_prescreen.json market_prescreen.json
          cp audit_results/candidate_artifacts/recovery_scan.json recovery_scan.json
          cp audit_results/candidate_artifacts/etf_scan.json etf_scan.json
          cp audit_results/candidate_artifacts/total_market_universe.json total_market_universe.json
          cp audit_results/candidate_artifacts/market_scan_state.json market_scan_state.json
          cp audit_results/candidate_artifacts/discovery_candidate_pool.json discovery_candidate_pool.json
          cp audit_results/candidate_artifacts/full_evaluation_pool.json full_evaluation_pool.json

      - name: Verify production Python grammar
        run: python -m compileall -q app.py ui services engines agents scripts

      - name: Launch exact-candidate Streamlit runtime
        env:
          ATLAS_AUDIT_PASSWORD: ${{ secrets.ATLAS_AUDIT_PASSWORD }}
          GUEST_PASSWORD: ${{ secrets.ATLAS_AUDIT_PASSWORD }}
        run: |
          mkdir -p audit_results/full_qa/${{ github.run_id }}
          python -m streamlit run app.py --server.headless true --server.port 8501 > audit_results/full_qa/${{ github.run_id }}/streamlit.log 2>&1 &
          echo $! > audit_results/full_qa/${{ github.run_id }}/streamlit.pid
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8501/_stcore/health && exit 0
            sleep 1
          done
          exit 1

      - name: Capture and validate desktop/mobile customer surfaces
        id: visual_qa
        continue-on-error: true
        env:
          ATLAS_AUDIT_PASSWORD: ${{ secrets.ATLAS_AUDIT_PASSWORD }}
        run: |
          python -m agents.full_qa_visual_certification \
            --url http://127.0.0.1:8501 \
            --root . \
            --output audit_results/full_qa/${{ github.run_id }}/visual

      - name: Emit sanitized local runtime diagnostics
        if: steps.visual_qa.outcome == 'failure'
        run: |
          tail -200 audit_results/full_qa/${{ github.run_id }}/streamlit.log || true
          cat audit_results/full_qa/${{ github.run_id }}/visual/deployed_readiness.json || true

      - name: Finalize certification and promote atomically
        id: qa
        run: |
          python scripts/run_full_qa_certification.py \
            --candidate-dir audit_results/candidate_artifacts \
            --production-dir . \
            --output-dir audit_results/full_qa/${{ github.run_id }} \
            --artifact-link https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} \
            --visual-summary audit_results/full_qa/${{ github.run_id }}/visual/atlas_full_qa_visual_summary.json \
            --screenshot-manifest audit_results/full_qa/${{ github.run_id }}/visual/screenshot_manifest.json \
            --promote

      - name: Upload QA certification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-full-qa-${{ github.run_id }}
          path: |
            audit_results/full_qa/${{ github.run_id }}
            audit_results/candidate_artifacts
            failed_publication_run.json
          if-no-files-found: warn
          retention-days: 90

      - name: Preserve exact generated candidate for deterministic reruns
        if: always() && steps.candidate.outputs.run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: atlas-scan-candidate-${{ github.run_id }}
          path: audit_results/candidate_artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Commit atomically certified production artifacts
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -- etf_scan.json market_full_scan.json market_prescreen.json discovery_candidate_pool.json full_evaluation_pool.json market_scan_state.json recovery_scan.json total_market_universe.json publication_manifest.json publication_audit.jsonl
          git commit -m "Publish QA-certified overnight market scan - $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No production changes to commit"
          git pull --rebase origin main
          # workflow_run checks out the triggering SHA in detached-HEAD mode.
          git push origin HEAD:main
