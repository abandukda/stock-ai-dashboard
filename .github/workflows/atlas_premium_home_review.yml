name: ATLAS Premium Home Review
on:
  pull_request:
    paths:
      - 'ui/report_card_overview.py'
      - 'tests/test_premium_report_card_registration_render.py'
      - 'tests/test_premium_report_card_immutable_render.py'
      - 'services/report_card_dashboard.py'
      - 'ui/internal_report_card.py'
      - 'ui/personal_account.py'
      - 'tests/test_personal_account_ui.py'
      - 'tests/test_premium_personal_account_render.py'
      - 'ui/personal_watchlists.py'
      - 'tests/test_premium_personal_watchlists_render.py'
      - 'tests/test_personal_watchlists_ui.py'
      - 'ui/home_guidance_vnext.py'
      - 'ui/earnings_vnext.py'
      - 'tests/test_earnings_cached_transcript_ui.py'
      - 'tests/test_premium_earnings_cache_render.py'
      - 'ui/premium_home_styles.py'
      - 'ui/home_reference_components.py'
      - 'ui/customer_research_v2.py'
      - 'ui/research_reference_components.py'
      - 'services/research_investment_digest.py'
      - 'services/presentation_source.py'
      - 'tests/test_presentation_source.py'
      - 'tests/test_home_owned_research_control.py'
      - 'services/customer_research_v2.py'
      - 'tests/test_research_investment_digest.py'
      - 'scripts/premium_research_review_fixture.py'
      - 'tests/test_home_reference_components.py'
      - 'tests/test_premium_home*'
      - 'tests/test_premium_research*'
      - 'scripts/premium_home_review_fixture.py'
      - '.github/workflows/atlas_premium_home_review.yml'
permissions:
  contents: read
jobs:
  provider-free-home-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ATLAS_QA_PROVIDER_CALLS_ALLOWED: '0'
      ATLAS_ALLOW_EXTERNAL_AI: 'false'
      ATLAS_CUSTOMER_REPORT_CARD_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt playwright==1.52.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_home_guidance_vnext.py tests/test_premium_home_command_center.py tests/test_home_reference_components.py tests/test_research_investment_digest.py tests/test_presentation_source.py tests/test_home_owned_research_control.py
      - run: python -m unittest discover -s tests -p 'test_premium_*render.py' -v
      - run: python -m pytest -q tests/test_premium_personal_account_render.py tests/test_premium_report_card_immutable_render.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-generated-home-review-${{ github.run_id }}
          path: |
            audit_results/premium_home
            audit_results/premium_research
          if-no-files-found: error
          retention-days: 14
