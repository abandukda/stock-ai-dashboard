name: ATLAS Premium Home Review
on:
  pull_request:
    paths:
      - 'ui/home_guidance_vnext.py'
      - 'ui/premium_home_styles.py'
      - 'tests/test_premium_home*'
      - 'scripts/premium_home_review_fixture.py'
      - '.github/workflows/atlas_premium_home_review.yml'
permissions:
  contents: read
jobs:
  provider-free-home-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ATLAS_QA_PROVIDER_CALLS_ALLOWED: '0'
      ATLAS_ALLOW_EXTERNAL_AI: 'false'
      ATLAS_CUSTOMER_REPORT_CARD_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install streamlit==1.50.0 pytest==9.1.1 playwright==1.52.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_home_guidance_vnext.py tests/test_premium_home_command_center.py
      - run: python -m unittest discover -s tests -p test_premium_home_render.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-generated-home-review-${{ github.run_id }}
          path: audit_results/premium_home
          if-no-files-found: error
          retention-days: 14
