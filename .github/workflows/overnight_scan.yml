name: Overnight Market Scan

on:
  schedule:
    - cron: "15 4 * * 1-5"
    - cron: "00 11 * * 1-5"
    - cron: "00 16 * * 1-5"
    - cron: "00 19 * * 1-5"
    - cron: "00 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  overnight-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      FAST_CRON_MODE: "true"
      FAST_CRON_SKIP_PRE_RANK_DEEP_APIS: "true"
      FULL_COMMITTEE_LIMIT: "15"
      ETF_FULL_COMMITTEE_LIMIT: "10"
      HTTP_TIMEOUT_FAST: "6"
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      TWELVE_DATA_ENABLED: "true"
      ATLAS_DATA_MODE: "INTERNAL_TRIAL"
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      GITHUB_REPO_URL: "abandukda/stock-ai-dashboard"
      DATA_DIR: "."
      # Certification run tests every requested pool size up to these maxima.
      DISCOVERY_CANDIDATE_POOL_SIZE: "1250"
      FULL_EVALUATION_POOL_SIZE: "650"
      DISCOVERY_VALIDATION_NEAR_CUTOFF: "100"
      DISCOVERY_VALIDATION_RANDOM: "100"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Force main branch checkout
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git status

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify canonical publication credentials
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ -z "${TWELVE_DATA_API_KEY:-}" ]; then
            echo "::error::TWELVE_DATA_API_KEY is required; refusing to overwrite canonical production actions"
            exit 1
          fi

      - name: Restore sanitized deep-research evidence cache
        uses: actions/cache@v4
        with:
          path: .atlas_research_cache/deep_v1
          key: atlas-deep-research-v1-${{ github.run_id }}
          restore-keys: |
            atlas-deep-research-v1-

      - name: Restore normalized FMP bulk-metadata shadow snapshot
        uses: actions/cache@v4
        with:
          path: .atlas_research_cache/fmp_bulk_metadata_v1
          key: atlas-fmp-bulk-metadata-v1-${{ github.run_id }}
          restore-keys: |
            atlas-fmp-bulk-metadata-v1-

      - name: Restore analyst-estimate snapshot history
        uses: actions/cache@v4
        with:
          path: .atlas_research_cache/analyst_estimate_snapshots_v1
          key: atlas-analyst-estimate-snapshots-v1-${{ github.run_id }}
          restore-keys: |
            atlas-analyst-estimate-snapshots-v1-

      - name: Run overnight scan
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          ATLAS_HARD_PUBLICATION_GOVERNANCE_ENABLED: "true"
          ATLAS_PUBLICATION_OUTPUT_MODE: "CANDIDATE"
          ATLAS_CANDIDATE_OUTPUT_DIR: "audit_results/candidate_artifacts"
        run: |
          python overnight_market_scan.py

      - name: Upload exact scan candidate
        uses: actions/upload-artifact@v4
        with:
          name: atlas-scan-candidate-${{ github.run_id }}
          path: |
            audit_results/candidate_artifacts/etf_scan.json
            audit_results/candidate_artifacts/market_full_scan.json
            audit_results/candidate_artifacts/market_prescreen.json
            audit_results/candidate_artifacts/market_scan_state.json
            audit_results/candidate_artifacts/discovery_candidate_pool.json
            audit_results/candidate_artifacts/full_evaluation_pool.json
            audit_results/candidate_artifacts/recovery_scan.json
            audit_results/candidate_artifacts/total_market_universe.json
            audit_results/candidate_artifacts/publication_manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload analyst-estimate snapshot history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-analyst-estimate-snapshots-${{ github.run_id }}
          path: .atlas_research_cache/analyst_estimate_snapshots_v1
          if-no-files-found: warn
          retention-days: 30

      - name: Confirm production remains unchanged pending QA
        run: git diff --exit-code -- discovery_candidate_pool.json full_evaluation_pool.json etf_scan.json market_full_scan.json market_prescreen.json market_scan_state.json recovery_scan.json total_market_universe.json publication_manifest.json publication_audit.jsonl
