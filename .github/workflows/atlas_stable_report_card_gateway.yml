name: ATLAS Stable Protected Report Card Gateway

on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: choice
        options: [validate, plan, acquire, append, storage_diagnostic, monitor_test]
      authorization_token:
        required: true
        type: string
      scope_sha256:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      scope_run_id:
        required: true
        type: string
      scope_artifact:
        required: true
        type: string
      scope_path:
        required: true
        type: string
      max_provider_calls:
        required: true
        type: string
      cutoff_utc:
        description: Explicit timezone-aware UTC evidence cutoff for finalized XNYS sessions
        required: true
        type: string

permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-stable-report-card-ledger
  cancel-in-progress: false

jobs:
  monitoring-delivery-test:
    if: inputs.operation == 'monitor_test'
    environment: atlas-internal-report-card
    runs-on: [self-hosted, Linux, X64, atlas-worker-1]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Enforce provider-free monitoring authorization
        env:
          TOKEN: ${{ inputs.authorization_token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$TOKEN" = "ATLAS_MONITOR_TEST_ONCE:$SOURCE_SHA"
          test -z "${FINNHUB_API_KEY:-}"
      - name: Send sanitized Cronitor delivery tests
        env:
          ATLAS_DAILY_BUY_NOW_CRONITOR_TEST_URL: ${{ secrets.ATLAS_DAILY_BUY_NOW_CRONITOR_TEST_URL }}
          ATLAS_REPORT_CARD_CRONITOR_URL: ${{ secrets.ATLAS_REPORT_CARD_CRONITOR_URL }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          mkdir -p audit_results/monitoring_delivery
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          test -n "$ATLAS_DAILY_BUY_NOW_CRONITOR_TEST_URL"
          test -n "$ATLAS_REPORT_CARD_CRONITOR_URL"
          python3 scripts/send_operational_heartbeat.py --operation DAILY_BUY_NOW --state complete --run-id "$GITHUB_RUN_ID-buy-now-success" --source-sha "$SOURCE_SHA" --trading-session 2026-10-14 --publication-status TEST_ONLY_NO_PUBLICATION --url-env ATLAS_DAILY_BUY_NOW_CRONITOR_TEST_URL > audit_results/monitoring_delivery/buy_now_complete.json
          python3 scripts/send_operational_heartbeat.py --operation DAILY_BUY_NOW --state fail --run-id "$GITHUB_RUN_ID-buy-now-failure" --source-sha "$SOURCE_SHA" --trading-session 2026-10-14 --publication-status TEST_ONLY_NO_PUBLICATION --failure-code CERTIFICATION_FAILURE --recovery-action "Inspect protected test run; no provider or publication action occurred" --url-env ATLAS_DAILY_BUY_NOW_CRONITOR_TEST_URL > audit_results/monitoring_delivery/buy_now_failure.json
          # This RUN event is deliberately not followed by COMPLETE/FAIL. Cronitor's
          # configured deadline must independently produce the missed-heartbeat alert.
          python3 scripts/send_operational_heartbeat.py --operation DAILY_BUY_NOW --state run --run-id "$GITHUB_RUN_ID-buy-now-missed" --source-sha "$SOURCE_SHA" --trading-session 2026-10-14 --publication-status TEST_ONLY_NO_PUBLICATION --url-env ATLAS_DAILY_BUY_NOW_CRONITOR_TEST_URL > audit_results/monitoring_delivery/buy_now_missed_started.json
          python3 scripts/send_operational_heartbeat.py --operation REPORT_CARD_G2 --state complete --run-id "$GITHUB_RUN_ID-report-card-success" --source-sha "$SOURCE_SHA" --trading-session 2026-10-09 --publication-status TEST_ONLY_NO_LEDGER_WRITE --url-env ATLAS_REPORT_CARD_CRONITOR_URL > audit_results/monitoring_delivery/report_card_complete.json
          python3 scripts/send_operational_heartbeat.py --operation REPORT_CARD_G2 --state fail --run-id "$GITHUB_RUN_ID-report-card-failure" --source-sha "$SOURCE_SHA" --trading-session 2026-10-09 --publication-status TEST_ONLY_NO_LEDGER_WRITE --failure-code LEDGER_INTEGRITY_FAILURE --recovery-action "Inspect protected test run; ledger was not accessed or modified" --url-env ATLAS_REPORT_CARD_CRONITOR_URL > audit_results/monitoring_delivery/report_card_failure.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = {p.stem: json.loads(p.read_text()) for p in Path('audit_results/monitoring_delivery').glob('*.json')}
          assert len(rows) == 5 and all(200 <= int(v['status']) < 300 for v in rows.values())
          Path('audit_results/monitoring_delivery/result.json').write_text(json.dumps({
              'status': 'DELIVERY_ACCEPTED_OWNER_EMAIL_CONFIRMATION_REQUIRED',
              'provider_calls': 0, 'publication_writes': 0, 'ledger_writes': 0,
              'sent_events': sorted(rows),
              'missed_heartbeat_pending_external_deadline': True,
          }, sort_keys=True, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-monitoring-delivery-test-${{ github.run_id }}
          path: audit_results/monitoring_delivery
          if-no-files-found: error
          retention-days: 90

  incremental-storage-diagnostic:
    if: inputs.operation == 'storage_diagnostic'
    environment: atlas-licensed-research-acquisition
    runs-on: [self-hosted, Linux, X64, atlas-worker-1]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Enforce provider-free diagnostic authorization
        env:
          TOKEN: ${{ inputs.authorization_token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$TOKEN" = "ATLAS_STORAGE_DIAGNOSTIC_ONCE:$SOURCE_SHA"
          test -z "${FINNHUB_API_KEY:-}"
      - name: Discover and verify existing durable candidates
        run: >-
          python3 scripts/diagnose_incremental_storage.py
          --checkout "$GITHUB_WORKSPACE"
          --output audit_results/incremental_storage/diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-incremental-storage-diagnostic-${{ github.run_id }}
          path: audit_results/incremental_storage/diagnostic.json
          if-no-files-found: error
          retention-days: 90

  protected-preflight:
    if: inputs.operation != 'storage_diagnostic' && inputs.operation != 'monitor_test'
    environment: atlas-internal-report-card
    runs-on: [self-hosted, Linux, X64, atlas-worker-1]
    timeout-minutes: 20
    env:
      ATLAS_REPORT_CARD_DURABLE_ROOT: ${{ vars.ATLAS_REPORT_CARD_DURABLE_ROOT }}
      ATLAS_REPORT_CARD_BACKUP_ROOT: ${{ vars.ATLAS_REPORT_CARD_BACKUP_ROOT }}
      REPORT_CARD_CUTOFF_UTC: ${{ inputs.cutoff_utc }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Enforce roots, operation-specific token and kill switch
        env:
          OPERATION: ${{ inputs.operation }}
          TOKEN: ${{ inputs.authorization_token }}
          SCOPE_SHA256: ${{ inputs.scope_sha256 }}
        run: |
          test "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}"
          test -n "$ATLAS_REPORT_CARD_DURABLE_ROOT"
          test -n "$ATLAS_REPORT_CARD_BACKUP_ROOT"
          test "$ATLAS_REPORT_CARD_DURABLE_ROOT" != "$ATLAS_REPORT_CARD_BACKUP_ROOT"
          test "$TOKEN" = "REPORT_CARD_${OPERATION^^}_ONCE:$SCOPE_SHA256"
          test "$(python3 scripts/validate_report_card_cutoff.py "$REPORT_CARD_CUTOFF_UTC")" = "$REPORT_CARD_CUTOFF_UTC"
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
          if [ "$OPERATION" = validate ] || [ "$OPERATION" = plan ]; then test -z "${FINNHUB_API_KEY:-}"; fi
      - name: Verify exact CLOSED acquisition sentinel
        # Verifies ATLAS_REPORT_CARD_DURABLE_ROOT/ACQUISITION_KILL_SWITCH is
        # a regular atlasrunner:atlasrunner 0600 file containing exactly CLOSED\n.
        run: >-
          python3 scripts/verify_report_card_closed_sentinel.py
          --durable-root "$ATLAS_REPORT_CARD_DURABLE_ROOT"
          --output audit_results/report_card_gateway/closed_sentinel.json
      - name: Download exact immutable scope
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.scope_artifact }}
          path: ${{ runner.temp }}/scope
          run-id: ${{ inputs.scope_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Verify exact immutable scope
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SCOPE_SHA256: ${{ inputs.scope_sha256 }}
          MAX_CALLS: ${{ inputs.max_provider_calls }}
          SCOPE_PATH: ${{ inputs.scope_path }}
        run: |
          python -c 'import json,os,pathlib; pathlib.Path("approval.json").write_text(json.dumps({"operation":os.environ["OPERATION"],"source_sha":os.environ["SOURCE_SHA"],"scope_sha256":os.environ["SCOPE_SHA256"],"max_provider_calls":int(os.environ["MAX_CALLS"]),"authorization_token":"ATLAS_{}:{}".format(os.environ["OPERATION"].upper(),os.environ["SCOPE_SHA256"])}))'
          python scripts/verify_operations_gateway.py --approval approval.json --scope-root "$RUNNER_TEMP/scope" --scope "$SCOPE_PATH" --run-id "$GITHUB_RUN_ID" --output audit_results/report_card_gateway/scope_envelope.json
      - name: Registered safe operations
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SCOPE_SHA256: ${{ inputs.scope_sha256 }}
          SCOPE_RUN_ID: ${{ inputs.scope_run_id }}
          SCOPE_ARTIFACT: ${{ inputs.scope_artifact }}
          SCOPE_PATH: ${{ inputs.scope_path }}
        run: |
          case "$OPERATION" in
            validate|plan)
              python scripts/build_report_card_exchange_calendar.py --start-date 2026-10-08 --cutoff-utc "$REPORT_CARD_CUTOFF_UTC" --output audit_results/report_card_gateway/xnys_calendar.json
              if [ "$OPERATION" = plan ]; then
                cp config/report_card_g2_entitlement_20261014.json audit_results/report_card_gateway/entitlement.json
                scope_file="$(find "$RUNNER_TEMP/scope" -type f -name "$SCOPE_PATH" -print -quit)"
                test -n "$scope_file"
                cp "$scope_file" audit_results/report_card_gateway/protected_validation.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from services.report_card_g2_release_binding import build_g2_release_binding

          root = Path("audit_results/report_card_gateway")
          entitlement = json.loads((root / "entitlement.json").read_text())
          protected = json.loads((root / "protected_validation.json").read_text())
          if protected.get("canonical_plan_sha256") != os.environ["SCOPE_SHA256"]:
              raise SystemExit("REPORT_CARD_PLAN_SCOPE_MISMATCH")
          binding = build_g2_release_binding(
              protected_validation=protected, entitlement=entitlement,
              release_source_sha=os.environ["SOURCE_SHA"],
              validation_run_id=os.environ["SCOPE_RUN_ID"],
              validation_artifact=os.environ["SCOPE_ARTIFACT"],
          )
          (root / "g2_binding.json").write_text(json.dumps(binding, sort_keys=True, indent=2) + "\n")
          PY
              fi
              ;;
            acquire|append)
              echo "Mutation/provider adapters remain separately reviewed and intentionally fail closed."
              exit 78
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-report-card-gateway-${{ inputs.operation }}-${{ github.run_id }}
          path: audit_results/report_card_gateway
          retention-days: 90
