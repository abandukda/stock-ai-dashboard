name: ATLAS Daily Incremental BUY NOW Coordinator

on:
  schedule:
    # Dual UTC wakeups cover EDT/EST. The XNYS/Eastern gate admits only 18:05 ET.
    - cron: "5 22 * * 1-5"
    - cron: "5 23 * * 1-5"
  workflow_dispatch:
    inputs:
      prepare_history_backfill:
        description: "Generate the source-bound provider-free continuity package"
        required: true
        type: boolean
        default: false
      authorize_backfill_plan:
        description: "Exact provider-free planning authorization"
        required: false
        type: string
      backfill_cutoff_utc:
        description: "Timezone-aware UTC cutoff for the newest finalized XNYS session"
        required: false
        type: string
      last_contiguous_session:
        description: "Last certified contiguous XNYS session"
        required: false
        type: string
      retained_artifact_set_sha256:
        description: "SHA-256 identity of the retained technical-history shard set"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: atlas-daily-incremental-buy-now
  cancel-in-progress: false

jobs:
  coordinator:
    if: github.event_name == 'schedule' || inputs.prepare_history_backfill != true
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      finalized_session: ${{ steps.gate.outputs.finalized_session }}
      continuity_mode: ${{ steps.gate.outputs.continuity_mode }}
      missing_session_count: ${{ steps.gate.outputs.missing_session_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install exchange_calendars==4.13.2
      - id: gate
        name: Select one finalized XNYS session
        env:
          CONFIGURED_CONTIGUOUS_SESSION: ${{ vars.ATLAS_LAST_CERTIFIED_CONTIGUOUS_SESSION }}
        shell: bash
        run: |
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          last_session="$(python3 - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('publication_manifest.json').read_text())
          print(value.get('finalized_market_session') or '')
          PY
          )"
          contiguous_session="$last_session"
          if test -z "$contiguous_session"; then
            contiguous_session="$CONFIGURED_CONTIGUOUS_SESSION"
          fi
          test -n "$contiguous_session" || {
            echo "No certified contiguous-session boundary is configured" >&2
            exit 1
          }
          python3 scripts/run_daily_buy_now_post_close.py \
            --now "$now" --last-published-session "$last_session" --root . \
            --last-contiguous-session "$contiguous_session" \
            --output audit_results/daily_incremental/coordinator.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value=json.load(open('audit_results/daily_incremental/coordinator.json'))['schedule']
          print('eligible=' + str(bool(value['eligible'])).lower())
          print('finalized_session=' + str(value['finalized_session']))
          continuity=json.load(open('audit_results/daily_incremental/coordinator.json'))['continuity']
          print('continuity_mode=' + str(continuity['mode']))
          print('missing_session_count=' + str(continuity['missing_session_count']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-daily-incremental-coordinator-${{ github.run_id }}
          path: audit_results/daily_incremental/coordinator.json
          if-no-files-found: error
          retention-days: 90

  provider-free-end-to-end:
    needs: coordinator
    if: >-
      needs.coordinator.outputs.eligible == 'true' &&
      needs.coordinator.outputs.continuity_mode == 'DAILY_APPEND' &&
      needs.coordinator.outputs.missing_session_count == '1'
    uses: ./.github/workflows/atlas_finnhub_incremental_acquisition.yml
    with:
      operation: plan
      source_sha: ${{ github.sha }}
      finalized_session: ${{ needs.coordinator.outputs.finalized_session }}
      membership_run_id: "37216506983"
      membership_artifact: atlas-finnhub-full-universe-final-37216506983

  live-operation-disabled:
    needs: [coordinator, provider-free-end-to-end]
    if: needs.provider-free-end-to-end.result == 'success'
    runs-on: ubuntu-24.04
    env:
      ATLAS_DAILY_BUY_NOW_LIVE_ENABLED: ${{ vars.ATLAS_DAILY_BUY_NOW_LIVE_ENABLED }}
    steps:
      - name: Fail closed until the incremental certification/promoter bridge is registered
        run: |
          test "$ATLAS_DAILY_BUY_NOW_LIVE_ENABLED" = false
          echo "Provider-free bounded planning completed."
          echo "The same registered acquisition entrypoint completed retained-evidence certification."
          echo "The atomic promoter rejected provider-free evidence as required."
          echo "Live acquisition and publication remain disabled; no token is consumed."

  continuity-backfill-required:
    needs: coordinator
    if: needs.coordinator.outputs.continuity_mode == 'BOUNDED_BACKFILL'
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed rather than skip missing sessions
        run: |
          echo "${{ needs.coordinator.outputs.missing_session_count }} ordered XNYS sessions require a separately approved source-bound backfill."
          echo "Daily append, certification, and publication were not started."

  prepare-history-backfill:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_history_backfill == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install exchange_calendars==4.13.2
      - name: Verify provider-free planning authority and inputs
        run: |
          test "${{ inputs.authorize_backfill_plan }}" = "ATLAS_BUY_NOW_BACKFILL_PLAN_ONCE"
          test -n "${{ inputs.backfill_cutoff_utc }}"
          test -n "${{ inputs.last_contiguous_session }}"
          test "${#RETAINED_SHA}" = 64
        env:
          RETAINED_SHA: ${{ inputs.retained_artifact_set_sha256 }}
      - name: Download immutable governed membership
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38829162008 \
            --name atlas-incremental-buy-now-plan-38829162008 \
            --dir "$RUNNER_TEMP/membership"
          test -f "$RUNNER_TEMP/membership/plan.json"
      - name: Create exact source-bound backfill package
        run: |
          python scripts/plan_buy_now_history_backfill.py \
            --source-sha "$(git rev-parse HEAD)" \
            --as-of "${{ inputs.backfill_cutoff_utc }}" \
            --last-contiguous-session "${{ inputs.last_contiguous_session }}" \
            --retained-artifact-set-sha256 "${{ inputs.retained_artifact_set_sha256 }}" \
            --governed-incremental-plan "$RUNNER_TEMP/membership/plan.json" \
            --output audit_results/daily_incremental/history_backfill_package.json
          python - <<'PY'
          import json
          value=json.load(open('audit_results/daily_incremental/history_backfill_package.json'))
          plan=value['backfill_plan']
          assert value['continuity']['mode']=='BOUNDED_BACKFILL'
          assert plan['customer_symbol_count']==1298
          assert plan['provider_calls']==plan['publication_writes']==0
          assert plan['automatic_retries']==0
          assert plan['request_count']==plan['absolute_request_ceiling']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-buy-now-history-backfill-plan-${{ github.run_id }}
          path: audit_results/daily_incremental/history_backfill_package.json
          if-no-files-found: error
          retention-days: 90
