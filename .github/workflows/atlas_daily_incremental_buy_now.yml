name: ATLAS Daily Incremental BUY NOW Coordinator

on:
  schedule:
    # Dual UTC wakeups cover EDT/EST. The XNYS/Eastern gate admits only 18:05 ET.
    - cron: "5 22 * * 1-5"
    - cron: "5 23 * * 1-5"
  workflow_dispatch:
    inputs:
      prepare_history_backfill:
        description: "Generate the source-bound provider-free continuity package"
        required: true
        type: boolean
        default: false
      execute_history_backfill_rehearsal:
        description: "Exercise the crash-safe backfill entrypoint without provider credentials"
        required: true
        type: boolean
        default: false
      execute_history_backfill_acquisition:
        description: "Execute one separately authorized consume-once historical backfill"
        required: true
        type: boolean
        default: false
      inspect_consumed_backfill_claim:
        description: "Provider-free forensic inspection of the exact consumed claim"
        required: true
        type: boolean
        default: false
      prepare_consumed_backfill_recovery:
        description: "Verify preserved evidence and prepare only never-attempted request scope"
        required: true
        type: boolean
        default: false
      authorize_backfill_rehearsal:
        description: "Provider-free exact-source rehearsal authority"
        required: false
        type: string
      backfill_claim_id:
        required: false
        type: string
      backfill_claim_scope_sha256:
        required: false
        type: string
      backfill_workflow_source_sha:
        required: false
        type: string
      authorize_backfill_acquisition:
        required: false
        type: string
      backfill_manual_enablement:
        required: false
        type: string
      authorize_backfill_inspection:
        required: false
        type: string
      authorize_backfill_recovery:
        description: "Provider-free exact-source recovery authority"
        required: false
        type: string
      authorize_backfill_plan:
        description: "Exact provider-free planning authorization"
        required: false
        type: string
      backfill_cutoff_utc:
        description: "Timezone-aware UTC cutoff for the newest finalized XNYS session"
        required: false
        type: string
      last_contiguous_session:
        description: "Last certified contiguous XNYS session"
        required: false
        type: string
      retained_artifact_set_sha256:
        description: "SHA-256 identity of the retained technical-history shard set"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: atlas-daily-incremental-buy-now
  cancel-in-progress: false

jobs:
  coordinator:
    if: >-
      github.event_name == 'schedule' ||
      (inputs.prepare_history_backfill != true && inputs.execute_history_backfill_rehearsal != true && inputs.execute_history_backfill_acquisition != true && inputs.inspect_consumed_backfill_claim != true && inputs.prepare_consumed_backfill_recovery != true)
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      finalized_session: ${{ steps.gate.outputs.finalized_session }}
      continuity_mode: ${{ steps.gate.outputs.continuity_mode }}
      missing_session_count: ${{ steps.gate.outputs.missing_session_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install exchange_calendars==4.13.2
      - id: gate
        name: Select one finalized XNYS session
        env:
          CONFIGURED_CONTIGUOUS_SESSION: ${{ vars.ATLAS_LAST_CERTIFIED_CONTIGUOUS_SESSION }}
        shell: bash
        run: |
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          last_session="$(python3 - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('publication_manifest.json').read_text())
          print(value.get('finalized_market_session') or '')
          PY
          )"
          contiguous_session="$last_session"
          if test -z "$contiguous_session"; then
            contiguous_session="$CONFIGURED_CONTIGUOUS_SESSION"
          fi
          test -n "$contiguous_session" || {
            echo "No certified contiguous-session boundary is configured" >&2
            exit 1
          }
          python3 scripts/run_daily_buy_now_post_close.py \
            --now "$now" --last-published-session "$last_session" --root . \
            --last-contiguous-session "$contiguous_session" \
            --output audit_results/daily_incremental/coordinator.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value=json.load(open('audit_results/daily_incremental/coordinator.json'))['schedule']
          print('eligible=' + str(bool(value['eligible'])).lower())
          print('finalized_session=' + str(value['finalized_session']))
          continuity=json.load(open('audit_results/daily_incremental/coordinator.json'))['continuity']
          print('continuity_mode=' + str(continuity['mode']))
          print('missing_session_count=' + str(continuity['missing_session_count']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-daily-incremental-coordinator-${{ github.run_id }}
          path: audit_results/daily_incremental/coordinator.json
          if-no-files-found: error
          retention-days: 90

  provider-free-end-to-end:
    needs: coordinator
    if: >-
      needs.coordinator.outputs.eligible == 'true' &&
      needs.coordinator.outputs.continuity_mode == 'DAILY_APPEND' &&
      needs.coordinator.outputs.missing_session_count == '1'
    uses: ./.github/workflows/atlas_finnhub_incremental_acquisition.yml
    with:
      operation: plan
      source_sha: ${{ github.sha }}
      finalized_session: ${{ needs.coordinator.outputs.finalized_session }}
      membership_run_id: "37216506983"
      membership_artifact: atlas-finnhub-full-universe-final-37216506983

  live-operation-disabled:
    needs: [coordinator, provider-free-end-to-end]
    if: needs.provider-free-end-to-end.result == 'success'
    runs-on: ubuntu-24.04
    env:
      ATLAS_DAILY_BUY_NOW_LIVE_ENABLED: ${{ vars.ATLAS_DAILY_BUY_NOW_LIVE_ENABLED }}
    steps:
      - name: Fail closed until the incremental certification/promoter bridge is registered
        run: |
          test "$ATLAS_DAILY_BUY_NOW_LIVE_ENABLED" = false
          echo "Provider-free bounded planning completed."
          echo "The same registered acquisition entrypoint completed retained-evidence certification."
          echo "The atomic promoter rejected provider-free evidence as required."
          echo "Live acquisition and publication remain disabled; no token is consumed."

  continuity-backfill-required:
    needs: coordinator
    if: needs.coordinator.outputs.continuity_mode == 'BOUNDED_BACKFILL'
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed rather than skip missing sessions
        run: |
          echo "${{ needs.coordinator.outputs.missing_session_count }} ordered XNYS sessions require a separately approved source-bound backfill."
          echo "Daily append, certification, and publication were not started."

  prepare-history-backfill:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_history_backfill == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install exchange_calendars==4.13.2
      - name: Verify provider-free planning authority and inputs
        run: |
          test "${{ inputs.authorize_backfill_plan }}" = "ATLAS_BUY_NOW_BACKFILL_PLAN_ONCE"
          test -n "${{ inputs.backfill_cutoff_utc }}"
          test -n "${{ inputs.last_contiguous_session }}"
          test "${#RETAINED_SHA}" = 64
        env:
          RETAINED_SHA: ${{ inputs.retained_artifact_set_sha256 }}
      - name: Download immutable governed membership
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38829162008 \
            --name atlas-incremental-buy-now-plan-38829162008 \
            --dir "$RUNNER_TEMP/membership"
          test -f "$RUNNER_TEMP/membership/plan.json"
      - name: Create exact source-bound backfill package
        run: |
          python scripts/plan_buy_now_history_backfill.py \
            --source-sha "$(git rev-parse HEAD)" \
            --as-of "${{ inputs.backfill_cutoff_utc }}" \
            --last-contiguous-session "${{ inputs.last_contiguous_session }}" \
            --retained-artifact-set-sha256 "${{ inputs.retained_artifact_set_sha256 }}" \
            --governed-incremental-plan "$RUNNER_TEMP/membership/plan.json" \
            --output audit_results/daily_incremental/history_backfill_package.json
          python - <<'PY'
          import json
          value=json.load(open('audit_results/daily_incremental/history_backfill_package.json'))
          plan=value['backfill_plan']
          assert value['continuity']['mode']=='BOUNDED_BACKFILL'
          assert plan['customer_symbol_count']==1298
          assert plan['provider_calls']==plan['publication_writes']==0
          assert plan['automatic_retries']==0
          assert plan['request_count']==plan['absolute_request_ceiling']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-buy-now-history-backfill-plan-${{ github.run_id }}
          path: audit_results/daily_incremental/history_backfill_package.json
          if-no-files-found: error
          retention-days: 90

  protected-history-backfill-rehearsal:
    if: github.event_name == 'workflow_dispatch' && inputs.execute_history_backfill_rehearsal == true
    environment: atlas-licensed-research-acquisition
    runs-on: [self-hosted, Linux, X64, atlas-worker-1]
    timeout-minutes: 180
    env:
      ATLAS_INCREMENTAL_RAW_ROOT: ${{ vars.ATLAS_INCREMENTAL_RAW_ROOT }}
      ATLAS_INCREMENTAL_CHECKPOINT_ROOT: ${{ vars.ATLAS_INCREMENTAL_CHECKPOINT_ROOT }}
      EXPECTED_SOURCE_SHA: 2b95d4fdc03d56a22b341ef5cdc1648333eab04b
      EXPECTED_ARTIFACT_ID: "12069093114"
      EXPECTED_ARTIFACT_ZIP_SHA256: c898793aeb379bb5aad1a2b1fdc568692d8562f96d53a20c081f4dd3243135dd
      EXPECTED_PACKAGE_SHA256: 594b4c45ce98b8466e742343d3c45a271cdf66dda68c8c07355ff46b801a8ee6
      EXPECTED_PLAN_SHA256: f59c6af515f9004be1de10d48998f26fba9a4972feef9e75582a67ff66b2a258
      EXPECTED_SCOPE_SHA256: 2059e22e81e47111ba14507c77828a5a54e6931ec1ab50fc4cc56b60b5cc6739
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Enforce exact source, durable storage, and provider isolation
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${{ inputs.authorize_backfill_rehearsal }}" = "ATLAS_BUY_NOW_BACKFILL_REHEARSE_ONCE:$EXPECTED_SOURCE_SHA"
          test -n "$ATLAS_INCREMENTAL_RAW_ROOT"
          test -n "$ATLAS_INCREMENTAL_CHECKPOINT_ROOT"
          test -z "${FINNHUB_API_KEY:-}"
          test "$(realpath "$ATLAS_INCREMENTAL_RAW_ROOT")" != "$(realpath "$ATLAS_INCREMENTAL_CHECKPOINT_ROOT")"
          case "$(realpath "$ATLAS_INCREMENTAL_RAW_ROOT")" in /tmp/*|*/_work/*|/mnt/atlas_report_card_*) exit 1;; esac
          case "$(realpath "$ATLAS_INCREMENTAL_CHECKPOINT_ROOT")" in /tmp/*|*/_work/*|/mnt/atlas_report_card_*) exit 1;; esac
      - name: Retrieve and verify the immutable protected plan ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/backfill-plan"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}/zip" \
            --output "$RUNNER_TEMP/backfill-plan.zip"
          test "$(sha256sum "$RUNNER_TEMP/backfill-plan.zip" | cut -d' ' -f1)" = "$EXPECTED_ARTIFACT_ZIP_SHA256"
          python3 - "$RUNNER_TEMP/backfill-plan.zip" "$RUNNER_TEMP/backfill-plan" <<'PY'
          import pathlib,sys,zipfile
          target=pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for member in archive.infolist():
                  destination=(target/member.filename).resolve()
                  if target not in destination.parents and destination != target:
                      raise SystemExit('BACKFILL_ARTIFACT_ZIP_PATH_INVALID')
              archive.extractall(target)
          PY
          package="$(find "$RUNNER_TEMP/backfill-plan" -name history_backfill_package.json -print -quit)"
          test -n "$package"
          cp "$package" "$RUNNER_TEMP/history_backfill_package.json"
      - name: Execute exact provider-free live-entrypoint rehearsal
        shell: bash
        run: |
          claim="rehearsal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p audit_results/daily_incremental
          start_epoch="$(date +%s)"
          /usr/bin/time -v -o audit_results/daily_incremental/history_backfill_resources.txt \
          python3 scripts/rehearse_buy_now_history_backfill.py \
            --package "$RUNNER_TEMP/history_backfill_package.json" \
            --state-root "$ATLAS_INCREMENTAL_CHECKPOINT_ROOT" \
            --raw-root "$ATLAS_INCREMENTAL_RAW_ROOT" \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --workflow-source-sha "$GITHUB_SHA" \
            --artifact-id "$EXPECTED_ARTIFACT_ID" \
            --artifact-zip-sha256 "$EXPECTED_ARTIFACT_ZIP_SHA256" \
            --package-sha256 "$EXPECTED_PACKAGE_SHA256" \
            --plan-sha256 "$EXPECTED_PLAN_SHA256" \
            --scope-sha256 "$EXPECTED_SCOPE_SHA256" \
            --claim-id "$claim" --execution-id "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --authorization "ATLAS_BUY_NOW_BACKFILL_REHEARSE_ONCE:$EXPECTED_SOURCE_SHA" \
            --output audit_results/daily_incremental/history_backfill_rehearsal.json
          end_epoch="$(date +%s)"
          raw_bytes="$(du -sb "$ATLAS_INCREMENTAL_RAW_ROOT/history_backfill/$claim" | cut -f1)"
          state_bytes="$(du -sb "$ATLAS_INCREMENTAL_CHECKPOINT_ROOT/history_backfill_claims/$claim" | cut -f1)"
          python3 - "$start_epoch" "$end_epoch" "$raw_bytes" "$state_bytes" <<'PY'
          import json,sys
          value={
              'wall_seconds':int(sys.argv[2])-int(sys.argv[1]),
              'raw_bytes':int(sys.argv[3]), 'checkpoint_bytes':int(sys.argv[4]),
              'total_durable_bytes':int(sys.argv[3])+int(sys.argv[4]),
          }
          open('audit_results/daily_incremental/history_backfill_resource_summary.json','w').write(
              json.dumps(value,sort_keys=True)+'\n')
          PY
          python3 - <<'PY'
          import json
          r=json.load(open('audit_results/daily_incremental/history_backfill_rehearsal.json'))
          assert r['status']=='COMPLETE'
          assert r['requests']==3894
          assert r['provider_calls']==r['publication_writes']==0
          assert r['evidence_classification']=='PROVIDER_FREE_FIXTURE'
          assert r['publication_authorized'] is False
          PY
      - name: Upload immutable rehearsal evidence
        uses: actions/upload-artifact@v4
        with:
          name: atlas-buy-now-history-backfill-rehearsal-${{ github.run_id }}
          path: |
            audit_results/daily_incremental/history_backfill_rehearsal.json
            audit_results/daily_incremental/history_backfill_resources.txt
            audit_results/daily_incremental/history_backfill_resource_summary.json
          if-no-files-found: error
          retention-days: 90

  protected-history-backfill-acquisition:
    if: github.event_name == 'workflow_dispatch' && inputs.execute_history_backfill_acquisition == true
    environment: atlas-licensed-research-acquisition
    runs-on: [self-hosted, Linux, X64, atlas-worker-1]
    timeout-minutes: 180
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ATLAS_INCREMENTAL_RAW_ROOT: ${{ vars.ATLAS_INCREMENTAL_RAW_ROOT }}
      ATLAS_INCREMENTAL_CHECKPOINT_ROOT: ${{ vars.ATLAS_INCREMENTAL_CHECKPOINT_ROOT }}
      ATLAS_BACKFILL_MANUAL_ACQUIRE_ENABLED: ${{ inputs.backfill_manual_enablement }}
      EXPECTED_SOURCE_SHA: 2b95d4fdc03d56a22b341ef5cdc1648333eab04b
      EXPECTED_ARTIFACT_ID: "12069093114"
      EXPECTED_ARTIFACT_ZIP_SHA256: c898793aeb379bb5aad1a2b1fdc568692d8562f96d53a20c081f4dd3243135dd
      EXPECTED_PACKAGE_SHA256: 594b4c45ce98b8466e742343d3c45a271cdf66dda68c8c07355ff46b801a8ee6
      EXPECTED_PLAN_SHA256: f59c6af515f9004be1de10d48998f26fba9a4972feef9e75582a67ff66b2a258
      EXPECTED_SCOPE_SHA256: 2059e22e81e47111ba14507c77828a5a54e6931ec1ab50fc4cc56b60b5cc6739
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python3 -m pip install --disable-pip-version-check requests==2.32.3
      - name: Enforce protected bounded authority
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "${{ inputs.backfill_workflow_source_sha }}" = "$GITHUB_SHA"
          test -n "$FINNHUB_API_KEY"
          test -n "$ATLAS_INCREMENTAL_RAW_ROOT"
          test -n "$ATLAS_INCREMENTAL_CHECKPOINT_ROOT"
          test "${{ inputs.backfill_manual_enablement }}" = "ENABLE_ATLAS_BACKFILL_ONCE:${{ inputs.backfill_claim_id }}"
          test "${{ inputs.authorize_backfill_acquisition }}" = "AUTHORIZE_ATLAS_BACKFILL_CLAIM:${{ inputs.backfill_claim_id }}:${{ inputs.backfill_claim_scope_sha256 }}"
      - name: Retrieve and verify exact plan artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EXPECTED_ARTIFACT_ID}/zip" \
            --output "$RUNNER_TEMP/backfill-plan.zip"
          test "$(sha256sum "$RUNNER_TEMP/backfill-plan.zip" | cut -d' ' -f1)" = "$EXPECTED_ARTIFACT_ZIP_SHA256"
          mkdir -p "$RUNNER_TEMP/backfill-plan"
          python3 - "$RUNNER_TEMP/backfill-plan.zip" "$RUNNER_TEMP/backfill-plan" <<'PY'
          import pathlib,sys,zipfile
          target=pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for member in archive.infolist():
                  destination=(target/member.filename).resolve()
                  if target not in destination.parents and destination != target:
                      raise SystemExit('BACKFILL_ARTIFACT_ZIP_PATH_INVALID')
              archive.extractall(target)
          PY
      - name: Execute raw-first bounded acquisition without publication
        shell: bash
        run: |
          package="$(find "$RUNNER_TEMP/backfill-plan" -name history_backfill_package.json -print -quit)"
          test -n "$package"
          python3 scripts/run_buy_now_history_backfill.py \
            --package "$package" --state-root "$ATLAS_INCREMENTAL_CHECKPOINT_ROOT" \
            --raw-root "$ATLAS_INCREMENTAL_RAW_ROOT" --source-sha "$EXPECTED_SOURCE_SHA" \
            --workflow-source-sha "${{ inputs.backfill_workflow_source_sha }}" \
            --artifact-id "$EXPECTED_ARTIFACT_ID" --artifact-zip-sha256 "$EXPECTED_ARTIFACT_ZIP_SHA256" \
            --package-sha256 "$EXPECTED_PACKAGE_SHA256" --plan-sha256 "$EXPECTED_PLAN_SHA256" \
            --scope-sha256 "$EXPECTED_SCOPE_SHA256" --claim-id "${{ inputs.backfill_claim_id }}" \
            --claim-scope-sha256 "${{ inputs.backfill_claim_scope_sha256 }}" \
            --execution-id "${GITHUB_RUN_ID}" \
            --authorization "${{ inputs.authorize_backfill_acquisition }}" \
            --output audit_results/daily_incremental/history_backfill_acquisition.json
          test ! -e audit_results/daily_incremental/publication_result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-buy-now-history-backfill-acquisition-${{ github.run_id }}
          path: audit_results/daily_incremental/history_backfill_acquisition.json
          if-no-files-found: warn
          retention-days: 90

  protected-history-backfill-forensics:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_consumed_backfill_claim == true
    environment: atlas-licensed-research-acquisition
    runs-on: [self-hosted, Linux, X64, atlas-worker-1]
    timeout-minutes: 20
    env:
      ATLAS_INCREMENTAL_RAW_ROOT: ${{ vars.ATLAS_INCREMENTAL_RAW_ROOT }}
      ATLAS_INCREMENTAL_CHECKPOINT_ROOT: ${{ vars.ATLAS_INCREMENTAL_CHECKPOINT_ROOT }}
      CLAIM_ID: oct02-oct15-2026-backfill-38962431540-01
      CLAIM_SCOPE_SHA256: 37de17d0217483bcba4046d381c811faa84f33227237b468e705f5e9bbf77b3d
      PLAN_ARTIFACT_ID: "12069093114"
      PLAN_ARTIFACT_ZIP_SHA256: c898793aeb379bb5aad1a2b1fdc568692d8562f96d53a20c081f4dd3243135dd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Enforce provider-free exact-claim authority
        env:
          TOKEN: ${{ inputs.authorize_backfill_inspection }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$TOKEN" = "ATLAS_BACKFILL_INSPECT_ONCE:$GITHUB_SHA:$CLAIM_ID"
          test -z "${FINNHUB_API_KEY:-}"
          test -n "$ATLAS_INCREMENTAL_RAW_ROOT"
          test -n "$ATLAS_INCREMENTAL_CHECKPOINT_ROOT"
      - name: Retrieve immutable plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PLAN_ARTIFACT_ID}/zip" \
            --output "$RUNNER_TEMP/backfill-plan.zip"
          test "$(sha256sum "$RUNNER_TEMP/backfill-plan.zip" | cut -d' ' -f1)" = "$PLAN_ARTIFACT_ZIP_SHA256"
          python3 - "$RUNNER_TEMP/backfill-plan.zip" "$RUNNER_TEMP/history_backfill_package.json" <<'PY'
          import pathlib,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              member=archive.getinfo('history_backfill_package.json')
              pathlib.Path(sys.argv[2]).write_bytes(archive.read(member))
          PY
      - name: Inspect exact consumed claim without provider access
        run: >-
          python3 scripts/inspect_buy_now_history_backfill_claim.py
          --package "$RUNNER_TEMP/history_backfill_package.json"
          --state-root "$ATLAS_INCREMENTAL_CHECKPOINT_ROOT"
          --raw-root "$ATLAS_INCREMENTAL_RAW_ROOT"
          --claim-id "$CLAIM_ID" --claim-scope-sha256 "$CLAIM_SCOPE_SHA256"
          --output audit_results/daily_incremental/history_backfill_forensics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-buy-now-history-backfill-forensics-${{ github.run_id }}
          path: audit_results/daily_incremental/history_backfill_forensics.json
          if-no-files-found: error
          retention-days: 90

  protected-history-backfill-recovery:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_consumed_backfill_recovery == true
    environment: atlas-licensed-research-acquisition
    runs-on: [self-hosted, Linux, X64, atlas-worker-1]
    timeout-minutes: 30
    env:
      ATLAS_INCREMENTAL_RAW_ROOT: ${{ vars.ATLAS_INCREMENTAL_RAW_ROOT }}
      ATLAS_INCREMENTAL_CHECKPOINT_ROOT: ${{ vars.ATLAS_INCREMENTAL_CHECKPOINT_ROOT }}
      CLAIM_ID: oct02-oct15-2026-backfill-38962431540-01
      CLAIM_SCOPE_SHA256: 37de17d0217483bcba4046d381c811faa84f33227237b468e705f5e9bbf77b3d
      PLAN_ARTIFACT_ID: "12069093114"
      PLAN_ARTIFACT_ZIP_SHA256: c898793aeb379bb5aad1a2b1fdc568692d8562f96d53a20c081f4dd3243135dd
      ATLAS_RUNNER_LABELS: self-hosted,Linux,X64,atlas-worker-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Enforce provider-free recovery authority
        env:
          TOKEN: ${{ inputs.authorize_backfill_recovery }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$TOKEN" = "ATLAS_BACKFILL_RECOVER_ONCE:$GITHUB_SHA:$CLAIM_ID"
          test -z "${FINNHUB_API_KEY:-}"
          test -n "$ATLAS_INCREMENTAL_RAW_ROOT"
          test -n "$ATLAS_INCREMENTAL_CHECKPOINT_ROOT"
      - name: Retrieve immutable original plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PLAN_ARTIFACT_ID}/zip" \
            --output "$RUNNER_TEMP/backfill-plan.zip"
          test "$(sha256sum "$RUNNER_TEMP/backfill-plan.zip" | cut -d' ' -f1)" = "$PLAN_ARTIFACT_ZIP_SHA256"
          python3 - "$RUNNER_TEMP/backfill-plan.zip" "$RUNNER_TEMP/history_backfill_package.json" <<'PY'
          import pathlib,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              member=archive.getinfo('history_backfill_package.json')
              pathlib.Path(sys.argv[2]).write_bytes(archive.read(member))
          PY
      - name: Fail-before-claim runner and storage preflight
        run: >-
          python3 scripts/preflight_buy_now_operation.py
          --source-sha "$GITHUB_SHA" --checked-out-sha "$(git rev-parse HEAD)"
          --raw-root "$ATLAS_INCREMENTAL_RAW_ROOT"
          --checkpoint-root "$ATLAS_INCREMENTAL_CHECKPOINT_ROOT"
          --request-ceiling 1046 --timeout-minutes 30
          --output audit_results/daily_incremental/history_backfill_recovery_preflight.json
      - name: Verify preserved evidence and build recovery package
        run: >-
          python3 scripts/prepare_buy_now_backfill_recovery.py
          --package "$RUNNER_TEMP/history_backfill_package.json"
          --state-root "$ATLAS_INCREMENTAL_CHECKPOINT_ROOT"
          --raw-root "$ATLAS_INCREMENTAL_RAW_ROOT"
          --claim-id "$CLAIM_ID" --claim-scope-sha256 "$CLAIM_SCOPE_SHA256"
          --registered-source-sha "$GITHUB_SHA"
          --recovery-claim-id "oct02-oct15-2026-backfill-recovery-${GITHUB_RUN_ID}-01"
          --output audit_results/daily_incremental/history_backfill_recovery_package.json
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-buy-now-history-backfill-recovery-${{ github.run_id }}
          path: |
            audit_results/daily_incremental/history_backfill_recovery_preflight.json
            audit_results/daily_incremental/history_backfill_recovery_package.json
          if-no-files-found: error
          retention-days: 90
