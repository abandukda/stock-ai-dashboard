name: Phase 2B Sanitized FMP Schema and Transcript Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitized-fmp-schema-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run five-request sanitized schema probe
        shell: bash
        run: |
          set +x
          echo "::add-mask::${FMP_API_KEY}"
          python -m analysis.phase2b.fmp_schema_transcript_probe

      - name: Upload sanitized schema summary
        uses: actions/upload-artifact@v4
        with:
          name: fmp-phase2b-schema-probe-summary
          path: fmp_phase2b_schema_probe_summary.json
          if-no-files-found: error
          retention-days: 7
