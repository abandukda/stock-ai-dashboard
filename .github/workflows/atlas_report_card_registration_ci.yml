name: ATLAS Report Card Registration CI

on:
  pull_request:
    paths:
      - ".github/workflows/atlas_report_card_*.yml"
      - "scripts/acquire_report_card_market_evidence.py"
      - "scripts/build_report_card_exchange_calendar.py"
      - "services/report_card_*.py"
      - "services/prospective_report_card.py"
      - "tests/test_report_card_*.py"

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install registration-only test dependencies
        run: python -m pip install exchange_calendars==4.13.2 PyYAML==6.0.3 playwright==1.52.0
      - name: Validate manual workflow registration contracts
        run: python -m pytest -q tests/test_report_card_workflow_registration.py
      - name: Validate calendar acquisition and deterministic production
        run: >-
          python -m pytest -q
          tests/test_report_card_exchange_calendar.py
          tests/test_report_card_calendar_workflow_cli.py
          tests/test_report_card_market_evidence_acquisition.py
          tests/test_report_card_observation_producer.py
          tests/test_report_card_observation_activation.py
          tests/test_internal_prospective_report_card.py
          tests/test_internal_prospective_report_card_workflow.py
          tests/test_report_card_end_to_end_offline.py
          tests/test_report_card_retained_chart.py
          tests/test_report_card_signal_digest.py
          tests/test_report_card_retained_inventory.py
          tests/test_report_card_overview_presentation.py
          tests/test_report_card_methodology_rehearsal.py
          tests/test_report_card_immutable_visibility.py
          tests/test_report_card_discovery_completeness.py
          tests/test_authentication_roles.py
      - name: Compile bounded Report Card modules
        run: >-
          python -m py_compile
          services/report_card_exchange_calendar.py
          services/report_card_market_evidence_acquisition.py
          services/report_card_observation_producer.py
          services/report_card_observation_activation.py
          scripts/build_report_card_exchange_calendar.py
          scripts/acquire_report_card_market_evidence.py
