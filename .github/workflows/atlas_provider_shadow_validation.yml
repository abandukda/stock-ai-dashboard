name: ATLAS Provider Shadow Validation

on:
  workflow_dispatch:
  push:
    branches:
      - codex/home-promotion-market-today-release

permissions:
  contents: read

jobs:
  provider-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      ATLAS_TRANSCRIPT_API_KEY: ${{ secrets.ATLAS_TRANSCRIPT_API_KEY }}
      ATLAS_TRANSCRIPT_API_BASE_URL: ${{ secrets.ATLAS_TRANSCRIPT_API_BASE_URL }}
      ATLAS_TRANSCRIPT_PROVIDER: ${{ vars.ATLAS_TRANSCRIPT_PROVIDER }}
      ATLAS_TRANSCRIPT_LICENSE_STATE: DEVELOPMENT_PRECOMMERCIAL
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run bounded provider shadow diagnostics
        run: python scripts/provider_migration_readiness.py --symbols AAPL,MSFT,NVDA
      - name: Run adversarial family-boundary tests
        run: pytest -q tests/test_provider_family_boundary_adversarial.py tests/test_provider_architecture_shadow.py tests/test_transcript_provider_contract.py
      - name: Assert production artifacts unchanged
        run: |
          if ! git diff --quiet -- market_full_scan.json market_prescreen.json market_scan_state.json publication_manifest.json; then
            echo "::error::Provider shadow diagnostics modified production artifacts"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-provider-shadow-${{ github.run_id }}
          path: audit_results/provider_shadow
          if-no-files-found: error
