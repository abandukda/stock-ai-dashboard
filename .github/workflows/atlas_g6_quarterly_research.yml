name: ATLAS G6 Quarterly Research

on:
  workflow_dispatch:
    inputs:
      evidence_source_sha:
        description: Frozen annual-statement evidence source SHA
        required: true
        type: string
      authorization_token:
        description: Exact owner-issued G6 quarterly token
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: atlas-g6-quarterly-research
  cancel-in-progress: false

jobs:
  acquire:
    environment: atlas-premium-g6-quarterly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ATLAS_FINNHUB_LICENSE_CLASS: PAID_CORE_CERTIFICATION
      G6_QUARTERLY_EXECUTE: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded runner dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.3
      - name: Fail closed unless protected identities and secret are exact
        env:
          G6_EVIDENCE_SOURCE_SHA: ${{ inputs.evidence_source_sha }}
          G6_AUTHORIZATION_TOKEN: ${{ inputs.authorization_token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$G6_EVIDENCE_SOURCE_SHA" = "220865a70214781db8a87d1b90a11cf0e4a50cdd"
          test "$G6_AUTHORIZATION_TOKEN" = "AUTHORIZE_G6_QUARTERLY:c0ddabaa766cb50b165f1703d84dd2374ca144645f598366bbf32d9d77cc3121"
          test -n "$FINNHUB_API_KEY"
          test "$ATLAS_FINNHUB_LICENSE_CLASS" = "PAID_CORE_CERTIFICATION"
      - name: Execute exact serial zero-retry quarterly manifest
        env:
          G6_EVIDENCE_SOURCE_SHA: ${{ inputs.evidence_source_sha }}
          G6_AUTHORIZATION_TOKEN: ${{ inputs.authorization_token }}
        run: |
          python scripts/run_g6_quarterly_research.py \
            --approval output/joint/r2_reconciliation/g6_quarterly_acquisition_approval.json \
            --manifest output/joint/r2_reconciliation/g6_quarterly_immutable_batches.json \
            --output-root output/g6-quarterly \
            --evidence-source-sha "$G6_EVIDENCE_SOURCE_SHA" \
            --execution-sha "$GITHUB_SHA" \
            --authorization-token "$G6_AUTHORIZATION_TOKEN"
      - name: Upload immutable raw evidence and sanitized telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-g6-quarterly-${{ github.run_id }}
          path: output/g6-quarterly
          if-no-files-found: error
          retention-days: 30
