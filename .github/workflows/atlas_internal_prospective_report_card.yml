name: ATLAS Internal Prospective Report Card

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Non-mutating storage validation or prospective capture
        required: true
        default: validate_storage
        type: choice
        options:
          - validate_storage
          - capture
      source_run_id:
        description: Certified publication source run
        required: false
        type: string
      artifact_name:
        description: Exact certified publication artifact name
        required: false
        type: string
      closure_run_id:
        description: Exact zero-provider closure run
        required: false
        type: string
      closure_artifact_name:
        description: Exact zero-provider closure artifact name
        required: false
        type: string
      historical_run_identity:
        description: Immutable historical acquisition run identity
        required: false
        type: string
      publication_filename:
        description: Exact certified publication file inside the artifact
        required: false
        default: market_full_scan.json
        type: choice
        options:
          - market_full_scan.json
          - full_evaluation_pool.json
      expected_candidate_digest:
        required: false
        type: string
      expected_publication_digest:
        required: false
        type: string
      expected_source_sha:
        required: false
        type: string
      activate_internal_capture:
        description: Explicitly activate internal prospective capture
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: atlas-internal-prospective-report-card
  cancel-in-progress: false

jobs:
  capture:
    environment: atlas-internal-report-card
    runs-on: [self-hosted, Linux, X64, atlas-worker-1]
    timeout-minutes: 20
    env:
      ATLAS_REPORT_CARD_DURABLE_ROOT: ${{ vars.ATLAS_REPORT_CARD_DURABLE_ROOT }}
      ATLAS_REPORT_CARD_BACKUP_ROOT: ${{ vars.ATLAS_REPORT_CARD_BACKUP_ROOT }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner Python 3 interpreter
        shell: bash
        run: |
          command -v python3
          python3 --version

      - name: Fail closed unless durable storage is configured
        shell: bash
        run: |
          test -n "$ATLAS_REPORT_CARD_DURABLE_ROOT"
          test -n "$ATLAS_REPORT_CARD_BACKUP_ROOT"
          test "${ATLAS_REPORT_CARD_DURABLE_ROOT#/}" != "$ATLAS_REPORT_CARD_DURABLE_ROOT"
          test "${ATLAS_REPORT_CARD_BACKUP_ROOT#/}" != "$ATLAS_REPORT_CARD_BACKUP_ROOT"
          test "$ATLAS_REPORT_CARD_DURABLE_ROOT" != "$ATLAS_REPORT_CARD_BACKUP_ROOT"
          case "$ATLAS_REPORT_CARD_DURABLE_ROOT" in "$GITHUB_WORKSPACE"*|"$RUNNER_TEMP"*) exit 1;; esac
          case "$ATLAS_REPORT_CARD_BACKUP_ROOT" in "$GITHUB_WORKSPACE"*|"$RUNNER_TEMP"*) exit 1;; esac

      - name: Validate real durable storage without operational activation
        if: ${{ inputs.operation == 'validate_storage' }}
        shell: bash
        run: |
          python3 scripts/validate_report_card_storage.py \
            --primary-root "$ATLAS_REPORT_CARD_DURABLE_ROOT" \
            --backup-root "$ATLAS_REPORT_CARD_BACKUP_ROOT" \
            --output audit_results/report_card_storage_validation.json

      - name: Require explicit capture authorization and identity
        if: ${{ inputs.operation == 'capture' }}
        shell: bash
        run: |
          test "${{ inputs.activate_internal_capture }}" = "true"
          test -n "${{ inputs.source_run_id }}"
          test -n "${{ inputs.artifact_name }}"
          test -n "${{ inputs.closure_run_id }}"
          test -n "${{ inputs.closure_artifact_name }}"
          test -n "${{ inputs.historical_run_identity }}"
          test -n "${{ inputs.expected_candidate_digest }}"
          test -n "${{ inputs.expected_publication_digest }}"
          test -n "${{ inputs.expected_source_sha }}"

      - name: Download exact certified publication
        if: ${{ inputs.operation == 'capture' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          name: ${{ inputs.artifact_name }}
          path: audit_results/report_card_source

      - name: Download exact zero-provider closure
        if: ${{ inputs.operation == 'capture' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.closure_run_id }}
          name: ${{ inputs.closure_artifact_name }}
          path: audit_results/report_card_closure

      - name: Resolve one manifest and one certified publication
        if: ${{ inputs.operation == 'capture' }}
        id: source
        shell: bash
        run: |
          mapfile -t manifests < <(find audit_results/report_card_source -type f -name publication_manifest.json)
          mapfile -t publications < <(find audit_results/report_card_source -type f -name "${{ inputs.publication_filename }}")
          test "${#manifests[@]}" -eq 1
          test "${#publications[@]}" -eq 1
          echo "manifest=${manifests[0]}" >> "$GITHUB_OUTPUT"
          echo "publication=${publications[0]}" >> "$GITHUB_OUTPUT"

      - name: Resolve one zero-provider closure report
        if: ${{ inputs.operation == 'capture' }}
        id: closure
        shell: bash
        run: |
          mapfile -t reports < <(find audit_results/report_card_closure -type f -name closure_report.json)
          test "${#reports[@]}" -eq 1
          echo "report=${reports[0]}" >> "$GITHUB_OUTPUT"

      - name: Build exact certified capture handoff
        if: ${{ inputs.operation == 'capture' }}
        shell: bash
        run: |
          python3 scripts/build_report_card_capture_handoff.py \
            --manifest "${{ steps.source.outputs.manifest }}" \
            --publication "${{ steps.source.outputs.publication }}" \
            --closure "${{ steps.closure.outputs.report }}" \
            --acquisition-run-id "${{ inputs.source_run_id }}" \
            --closure-run-id "${{ inputs.closure_run_id }}" \
            --historical-run-identity "${{ inputs.historical_run_identity }}" \
            --expected-candidate-digest "${{ inputs.expected_candidate_digest }}" \
            --expected-publication-digest "${{ inputs.expected_publication_digest }}" \
            --expected-source-sha "${{ inputs.expected_source_sha }}" \
            --output audit_results/report_card_capture_handoff.json

      - name: Capture prospective signals and verify backup recovery
        if: ${{ inputs.operation == 'capture' }}
        shell: bash
        run: |
          activation_timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/run_internal_prospective_report_card.py \
            --manifest "${{ steps.source.outputs.manifest }}" \
            --publication "${{ steps.source.outputs.publication }}" \
            --closure "${{ steps.closure.outputs.report }}" \
            --capture-handoff audit_results/report_card_capture_handoff.json \
            --ledger "$ATLAS_REPORT_CARD_DURABLE_ROOT/report-card.sqlite3" \
            --backup-root "$ATLAS_REPORT_CARD_BACKUP_ROOT" \
            --activation-timestamp "$activation_timestamp" \
            --expected-candidate-digest "${{ inputs.expected_candidate_digest }}" \
            --expected-publication-digest "${{ inputs.expected_publication_digest }}" \
            --expected-source-sha "${{ inputs.expected_source_sha }}" \
            --output audit_results/internal_report_card_capture.json

      - name: Assert internal-only zero-provider boundary
        if: ${{ inputs.operation == 'capture' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open('audit_results/internal_report_card_capture.json'))
          assert report['provider_calls'] == 0
          assert report['reacquisition'] == 'none'
          assert report['customer_report_card_visible'] is False
          assert report['status'] in {'CAPTURED', 'IDEMPOTENT_NO_CHANGE', 'NO_ELIGIBLE_SIGNAL'}
          PY

      - name: Confirm production decisions unchanged
        shell: bash
        run: |
          git diff --exit-code -- \
            market_full_scan.json full_evaluation_pool.json publication_manifest.json \
            market_scan_state.json market_prescreen.json recovery_scan.json \
            total_market_universe.json etf_scan.json

      - name: Upload sanitized internal audit result
        uses: actions/upload-artifact@v4
        with:
          name: atlas-internal-report-card-audit-${{ github.run_id }}
          path: |
            audit_results/internal_report_card_capture.json
            audit_results/report_card_capture_handoff.json
            audit_results/report_card_storage_validation.json
          retention-days: 30
          if-no-files-found: error
