name: ATLAS Finnhub Canonical Proving Set

on:
  push:
    branches:
      - codex/home-promotion-market-today-release
    paths:
      - .github/workflows/atlas_finnhub_canonical_proving.yml
      - scripts/finnhub_canonical_proving_set.py
      - services/finnhub_canonical_authority.py
      - services/completed_session_volume_authority.py
      - services/evidence_inspector.py
      - engines/canonical_investment_evaluation_v1.py
      - tests/test_finnhub_canonical_authority.py
      - tests/test_canonical_valuation_provider_contract.py

permissions:
  contents: read

jobs:
  prove-canonical-path:
    if: ${{ github.ref == 'refs/heads/codex/home-promotion-market-today-release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ATLAS_FINNHUB_LICENSE_CLASS: PAID_CORE_CERTIFICATION
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Assert canonical proving environment
        run: |
          test "$GITHUB_REF" = "refs/heads/codex/home-promotion-market-today-release"
          test "$ATLAS_FINNHUB_LICENSE_CLASS" = "PAID_CORE_CERTIFICATION"
          test -n "$FINNHUB_API_KEY"
          test -z "${TWELVE_DATA_API_KEY:-}"
          test -z "${FMP_API_KEY:-}"
      - name: Run authority and contract tests
        run: >-
          pytest -q
          tests/test_finnhub_canonical_authority.py
          tests/test_canonical_valuation_provider_contract.py
          tests/test_evidence_inspector.py
          tests/test_finnhub_p_fcf_peer_certification.py
          tests/test_professional_valuation_evidence.py
      - name: Run 12-symbol canonical proving set
        run: python scripts/finnhub_canonical_proving_set.py
      - name: Assert production artifacts unchanged
        run: |
          git diff --exit-code -- market_full_scan.json market_prescreen.json market_scan_state.json publication_manifest.json
      - name: Build immutable artifact manifest
        if: always()
        env:
          ATLAS_SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          root = Path("audit_results/finnhub_canonical")
          root.mkdir(parents=True, exist_ok=True)
          (root / "source_sha.txt").write_text(os.environ["ATLAS_SOURCE_SHA"] + "\n", encoding="utf-8")
          artifacts = {}
          for path in sorted(root.glob("*")):
              if path.is_file() and path.name != "artifact_manifest.json":
                  artifacts[path.name] = {
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "bytes": path.stat().st_size,
                  }
          (root / "artifact_manifest.json").write_text(json.dumps({
              "source_sha": os.environ["ATLAS_SOURCE_SHA"],
              "artifacts": artifacts,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-finnhub-canonical-proving-${{ github.run_id }}
          path: audit_results/finnhub_canonical
          if-no-files-found: error
