name: ATLAS Finnhub Publication-Only Recovery

on:
  push:
    branches:
      - codex/full-universe-closure-temp
    paths:
      - .github/workflows/atlas_finnhub_publication_only_recovery.yml
      - scripts/run_finnhub_full_universe.py
      - services/executor_publication_bridge.py
      - services/publication_governance.py
      - requirements.txt
      - tests/test_full_universe_aggregation_recovery.py

permissions:
  actions: read
  contents: read

env:
  PYTHONPATH: "."
  CERTIFIED_RUN_ID: "36817772978"
  EXPECTED_CANDIDATE_DIGEST: "96936e2b03af129c586ef2043a517068156449a8d1b8dc3d83618451ec90e77f"

jobs:
  build-publication-candidate-only:
    if: ${{ github.ref == 'refs/heads/codex/full-universe-closure-temp' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.CERTIFIED_RUN_ID }}
          name: atlas-merged-shard-checkpoint-${{ env.CERTIFIED_RUN_ID }}
          path: audit_results/recovery/merged
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.CERTIFIED_RUN_ID }}
          name: atlas-canonical-evaluation-forward-checkpoint-${{ env.CERTIFIED_RUN_ID }}
          path: audit_results/recovery/canonical
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.CERTIFIED_RUN_ID }}
          name: atlas-immutable-candidate-forward-checkpoint-${{ env.CERTIFIED_RUN_ID }}
          path: audit_results/recovery/candidate
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.CERTIFIED_RUN_ID }}
          name: atlas-candidate-determinism-checkpoint-${{ env.CERTIFIED_RUN_ID }}
          path: audit_results/recovery/determinism
      - name: Verify certified publication inputs
        run: |
          python - <<'PY'
          import json, os
          determinism = json.load(open('audit_results/recovery/determinism/candidate_determinism_checkpoint.json'))
          expected = os.environ['EXPECTED_CANDIDATE_DIGEST']
          assert determinism['payload']['forward_candidate_digest'] == expected
          assert determinism['payload']['reverse_candidate_digest'] == expected
          assert determinism['payload']['determinism']['status'] == 'PASS'
          assert determinism['payload']['determinism']['structural_diff']['analytical_mismatch_count'] == 0
          assert determinism['provider_calls_during_aggregation'] == 0
          PY
      - name: Publication runner diagnostics
        run: |
          uname -a
          nproc
          free -h
          df -h
      - name: Build publication projection without analytical recomputation
        run: |
          /usr/bin/time -v python scripts/run_finnhub_full_universe.py publish-checkpoint \
            --merged-checkpoint audit_results/recovery/merged/merged_shard_checkpoint.json \
            --canonical-checkpoint audit_results/recovery/canonical/canonical_evaluation_forward_checkpoint.json \
            --canonical-candidate-checkpoint audit_results/recovery/candidate/immutable_candidate_forward_checkpoint.json \
            --determinism-checkpoint audit_results/recovery/determinism/candidate_determinism_checkpoint.json \
            --expected-candidate-digest "$EXPECTED_CANDIDATE_DIGEST" \
            --output audit_results/recovery/final
          du -sh audit_results/recovery/final
          df -h
      - name: Confirm publication boundary and production immutability
        run: |
          python - <<'PY'
          import json, os
          base = 'audit_results/recovery/final'
          checkpoint = json.load(open(f'{base}/final_candidate_checkpoint.json'))
          report = json.load(open(f'{base}/full_universe_gate_report.json'))
          manifest = json.load(open(f'{base}/publication_bundle/publication_manifest.json'))
          assert checkpoint['provider_calls_during_aggregation'] == 0
          assert checkpoint['payload']['candidate_digest'] == os.environ['EXPECTED_CANDIDATE_DIGEST']
          assert report['determinism']['status'] == 'PASS'
          assert report['evidence_inspector_coverage']['status'] == 'PASS'
          assert report['report_card_prospective_active'] is False
          assert report['production_schedule_cutover'] is False
          assert manifest['executor_candidate_identity']['candidate_digest'] == os.environ['EXPECTED_CANDIDATE_DIGEST']
          assert manifest['executor_candidate_digest_verified'] is True
          PY
          git diff --exit-code -- market_full_scan.json market_prescreen.json market_scan_state.json publication_manifest.json discovery_candidate_pool.json full_evaluation_pool.json total_market_universe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-finnhub-publication-only-recovered-${{ github.run_id }}
          path: audit_results/recovery/final
          if-no-files-found: error
          retention-days: 7
