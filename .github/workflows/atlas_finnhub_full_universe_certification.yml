name: ATLAS Finnhub Full-Universe Certification

on:
  schedule:
    # GitHub cron is UTC. Both wakeups are intentional; the coordinator admits
    # only 18:00 America/New_York and the publication identity is idempotent.
    - cron: "5 22 * * 1-5"
    - cron: "5 23 * * 1-5"
  workflow_dispatch:
    inputs:
      execution_mode:
        description: Provider-free validation or explicitly enabled live operation
        required: true
        default: provider_free
        type: choice
        options: [provider_free, live]
      authorization:
        description: Exact protected daily acquisition authorization
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: atlas-daily-buy-now-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: "."
  ATLAS_FINNHUB_LICENSE_CLASS: PAID_CORE_CERTIFICATION
  SHARD_SIZE: "150"
  ATLAS_FINNHUB_GLOBAL_REQUESTS_PER_MINUTE: "500"

jobs:
  post-close-coordinator:
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      run_live: ${{ steps.gate.outputs.run_live }}
      finalized_session: ${{ steps.gate.outputs.finalized_session }}
    env:
      LIVE_ENABLED: ${{ vars.ATLAS_DAILY_BUY_NOW_LIVE_ENABLED }}
      LIVE_AUTHORIZATION: ${{ secrets.ATLAS_DAILY_BUY_NOW_AUTHORIZATION }}
      CRONITOR_URL: ${{ secrets.ATLAS_DAILY_BUY_NOW_CRONITOR_URL }}
      DISPATCH_MODE: ${{ inputs.execution_mode }}
      DISPATCH_AUTHORIZATION: ${{ inputs.authorization }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned XNYS calendar dependency
        run: python -m pip install exchange_calendars==4.13.2
      - name: Evaluate post-close session and provider-free publication gates
        id: gate
        run: |
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          last_session="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('publication_manifest.json')
          v=json.loads(p.read_text()) if p.exists() else {}
          print(str(v.get('finalized_market_session') or ''))
          PY
          )"
          python scripts/run_daily_buy_now_post_close.py \
            --now "$now" --last-published-session "$last_session" --root . \
            --output audit_results/daily_buy_now/coordinator.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          p=json.load(open('audit_results/daily_buy_now/coordinator.json'))
          scheduled=os.environ.get('GITHUB_EVENT_NAME') == 'schedule'
          requested=(os.environ.get('DISPATCH_MODE') or 'provider_free') == 'live'
          enabled=os.environ.get('LIVE_ENABLED') == 'true'
          expected=os.environ.get('LIVE_AUTHORIZATION') or ''
          supplied=os.environ.get('DISPATCH_AUTHORIZATION') or ''
          required='DAILY_BUY_NOW_LIVE:' + os.environ['GITHUB_SHA']
          configured=(expected == required and bool(os.environ.get('CRONITOR_URL')))
          live=(scheduled and enabled and configured) or (not scheduled and requested and configured and supplied == required)
          if live and not p['schedule']['eligible']:
              live=False
          print('eligible=' + str(bool(p['schedule']['eligible'])).lower())
          print('run_live=' + str(bool(live)).lower())
          print('finalized_session=' + str(p['schedule']['finalized_session']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-daily-buy-now-heartbeat-${{ github.run_id }}
          path: audit_results/daily_buy_now
          if-no-files-found: error
          retention-days: 90

  provider-free-end-to-end:
    needs: post-close-coordinator
    if: ${{ needs.post-close-coordinator.outputs.run_live != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install provider-free dependencies
        run: python -m pip install pytest==9.1.1 exchange_calendars==4.13.2
      - name: Exercise schedule, calendar, scoring identity, certification, and publication gates
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_daily_buy_now_post_close.py \
            tests/test_operational_heartbeat.py \
            tests/test_report_card_exchange_calendar.py \
            tests/test_full_universe_promotion_input.py

  monitor-start:
    needs: post-close-coordinator
    if: ${{ needs.post-close-coordinator.outputs.run_live == 'true' }}
    runs-on: ubuntu-latest
    env:
      ATLAS_DAILY_BUY_NOW_CRONITOR_URL: ${{ secrets.ATLAS_DAILY_BUY_NOW_CRONITOR_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Record externally monitored start
        run: >-
          python scripts/send_operational_heartbeat.py
          --operation DAILY_BUY_NOW --state run
          --run-id "$GITHUB_RUN_ID" --source-sha "$GITHUB_SHA"
          --trading-session "${{ needs.post-close-coordinator.outputs.finalized_session }}"
          --publication-status STARTED
          --recovery-action "Inspect the governed run and retain the last valid customer snapshot."
          --url-env ATLAS_DAILY_BUY_NOW_CRONITOR_URL

  contract-tests:
    needs: post-close-coordinator
    if: ${{ needs.post-close-coordinator.outputs.run_live == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/full-universe-closure-temp') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable run identity from checkout
        run: python3 scripts/resolve_finnhub_run_identity.py --expected-sha "$GITHUB_SHA" --github-env "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Assert non-publishing certification environment
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/codex/full-universe-closure-temp) ;;
            *) echo "::error::Unsupported full-universe certification ref: $GITHUB_REF"; exit 1 ;;
          esac
          test "$ATLAS_FINNHUB_LICENSE_CLASS" = "PAID_CORE_CERTIFICATION"
          test -n "$FINNHUB_API_KEY"
          test -z "${TWELVE_DATA_API_KEY:-}"
          test -z "${FMP_API_KEY:-}"
      - run: >-
          pytest -q tests/test_finnhub_full_universe_executor.py
          tests/test_finnhub_run_identity.py
          tests/test_full_universe_brain_certification.py
          tests/test_finnhub_canonical_authority.py
          tests/test_finnhub_p_fcf_peer_certification.py

  canary-50:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable run identity from checkout
        run: python3 scripts/resolve_finnhub_run_identity.py --expected-sha "$GITHUB_SHA" --github-env "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: audit_results/checkpoints/canary50
          key: atlas-finnhub-canary50-${{ github.run_id }}
      - name: Plan and execute deterministic 50-symbol canary
        run: |
          python scripts/run_finnhub_full_universe.py plan --canary-size 50 --output audit_results/full_universe/canary50
          python scripts/run_finnhub_full_universe.py run-shard --strict-provider-health --global-requests-per-minute 500 --parallel-workers 1 --canary-size 50 --shard-index 0 --checkpoint-dir audit_results/checkpoints/canary50/acquisition --output audit_results/full_universe/canary50/shards
          python scripts/run_finnhub_full_universe.py aggregate --canary-size 50 --shards audit_results/full_universe/canary50/shards --checkpoint-dir audit_results/checkpoints/canary50/evaluation --output audit_results/full_universe/canary50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-finnhub-canary50-${{ github.run_id }}
          path: audit_results/full_universe/canary50
          if-no-files-found: error

  canary-250:
    needs: canary-50
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable run identity from checkout
        run: python3 scripts/resolve_finnhub_run_identity.py --expected-sha "$GITHUB_SHA" --github-env "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: audit_results/checkpoints/canary250
          key: atlas-finnhub-canary250-${{ github.run_id }}
      - name: Plan deterministic 250-symbol canary
        run: python scripts/run_finnhub_full_universe.py plan --canary-size 250 --output audit_results/full_universe/canary250
      - name: Execute canary shards sequentially
        run: |
          python scripts/run_finnhub_full_universe.py run-shard --strict-provider-health --global-requests-per-minute 500 --parallel-workers 1 --canary-size 250 --shard-index 0 --checkpoint-dir audit_results/checkpoints/canary250/acquisition --output audit_results/full_universe/canary250/shards
          python scripts/run_finnhub_full_universe.py run-shard --strict-provider-health --global-requests-per-minute 500 --parallel-workers 1 --canary-size 250 --shard-index 1 --checkpoint-dir audit_results/checkpoints/canary250/acquisition --output audit_results/full_universe/canary250/shards
          python scripts/run_finnhub_full_universe.py aggregate --canary-size 250 --shards audit_results/full_universe/canary250/shards --checkpoint-dir audit_results/checkpoints/canary250/evaluation --output audit_results/full_universe/canary250
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-finnhub-canary250-${{ github.run_id }}
          path: audit_results/full_universe/canary250
          if-no-files-found: error

  plan-full-run:
    needs: canary-250
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable run identity from checkout
        run: python3 scripts/resolve_finnhub_run_identity.py --expected-sha "$GITHUB_SHA" --github-env "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Build immutable 41-shard manifest
        run: python scripts/run_finnhub_full_universe.py plan --output audit_results/full_universe/full
      - id: matrix
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          payload=json.load(open("audit_results/full_universe/full/shard_manifest.json"))
          print("value=" + json.dumps({"shard_index":[item["index"] for item in payload["shards"]]}, separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-finnhub-full-run-plan-${{ github.run_id }}
          path: audit_results/full_universe/full

  acquire-full-shards:
    needs: plan-full-run
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan-full-run.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable run identity from checkout
        run: python3 scripts/resolve_finnhub_run_identity.py --expected-sha "$GITHUB_SHA" --github-env "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: audit_results/checkpoints/full-shard-${{ matrix.shard_index }}
          key: atlas-finnhub-full-shard-${{ github.run_id }}-${{ matrix.shard_index }}
      - name: Acquire canonical shard
        run: >-
          python scripts/run_finnhub_full_universe.py run-shard
          --strict-provider-health
          --global-requests-per-minute 500
          --parallel-workers 2
          --shard-index ${{ matrix.shard_index }}
          --checkpoint-dir audit_results/checkpoints/full-shard-${{ matrix.shard_index }}
          --output audit_results/full_universe/shard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-finnhub-full-shard-${{ matrix.shard_index }}-${{ github.run_id }}
          path: audit_results/full_universe/shard
          if-no-files-found: error

  aggregate-full-run:
    needs: [plan-full-run, acquire-full-shards]
    if: ${{ always() && needs.plan-full-run.result == 'success' && needs.acquire-full-shards.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable run identity from checkout
        run: python3 scripts/resolve_finnhub_run_identity.py --expected-sha "$GITHUB_SHA" --github-env "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: audit_results/checkpoints/full-evaluation
          key: atlas-finnhub-full-evaluation-${{ github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          pattern: atlas-finnhub-full-shard-*-${{ github.run_id }}
          path: audit_results/full_universe/downloaded
          merge-multiple: true
      - name: Aggregate, certify, and deterministically replay without reacquisition
        run: >-
          python scripts/run_finnhub_full_universe.py aggregate
          --shards audit_results/full_universe/downloaded
          --checkpoint-dir audit_results/checkpoints/full-evaluation
          --output audit_results/full_universe/final
      - name: Confirm production artifacts unchanged
        run: >-
          git diff --exit-code -- market_full_scan.json market_prescreen.json
          market_scan_state.json publication_manifest.json discovery_candidate_pool.json
          full_evaluation_pool.json total_market_universe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-finnhub-full-universe-final-${{ github.run_id }}
          path: audit_results/full_universe/final
          if-no-files-found: error

  publish-certified-snapshot:
    needs: [post-close-coordinator, aggregate-full-run]
    if: ${{ needs.post-close-coordinator.outputs.run_live == 'true' && needs.aggregate-full-run.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: atlas-finnhub-full-universe-final-${{ github.run_id }}
          path: audit_results/full_universe/final
      - name: Require unchanged source before atomic publication
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Atomically promote the certified customer snapshot
        run: >-
          python scripts/promote_daily_buy_now_snapshot.py
          --artifact-root audit_results/full_universe/final
          --production-root .
          --run-id "${{ github.run_id }}"
          --source-sha "$GITHUB_SHA"
          --finalized-session "${{ needs.post-close-coordinator.outputs.finalized_session }}"
          --output audit_results/daily_buy_now/publication.json
      - name: Commit only governed customer publication artifacts
        run: |
          git config user.name atlas-daily-buy-now
          git config user.email atlas-daily-buy-now@users.noreply.github.com
          git add market_full_scan.json market_scan_state.json discovery_candidate_pool.json \
            full_evaluation_pool.json market_prescreen.json total_market_universe.json \
            recovery_scan.json etf_scan.json publication_manifest.json publication_audit.jsonl
          git diff --cached --quiet && exit 0
          git commit -m "data: publish certified BUY NOW snapshot for ${{ needs.post-close-coordinator.outputs.finalized_session }}"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-daily-buy-now-publication-${{ github.run_id }}
          path: audit_results/daily_buy_now/publication.json
          if-no-files-found: error
          retention-days: 365

  operational-alert:
    needs: [post-close-coordinator, monitor-start, contract-tests, canary-50, canary-250, full-universe-shards, provider-free-end-to-end, aggregate-full-run, publish-certified-snapshot]
    if: ${{ always() && needs.post-close-coordinator.outputs.run_live == 'true' }}
    runs-on: ubuntu-latest
    env:
      ATLAS_DAILY_BUY_NOW_CRONITOR_URL: ${{ secrets.ATLAS_DAILY_BUY_NOW_CRONITOR_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Send sanitized failure or completion heartbeat to email monitor
        env:
          COORDINATOR_RESULT: ${{ needs.post-close-coordinator.result }}
          DRY_RUN_RESULT: ${{ needs.provider-free-end-to-end.result }}
          CONTRACT_RESULT: ${{ needs.contract-tests.result }}
          CANARY50_RESULT: ${{ needs.canary-50.result }}
          CANARY250_RESULT: ${{ needs.canary-250.result }}
          SHARDS_RESULT: ${{ needs.full-universe-shards.result }}
          AGGREGATION_RESULT: ${{ needs.aggregate-full-run.result }}
          PUBLICATION_RESULT: ${{ needs.publish-certified-snapshot.result }}
        run: |
          if test "$PUBLICATION_RESULT" = success; then
            state=complete; status=PUBLISHED; failure=NONE
            recovery="No recovery required; verify the retained publication receipt."
          elif test "$CONTRACT_RESULT" != success || test "$CANARY50_RESULT" != success || test "$CANARY250_RESULT" != success || test "$SHARDS_RESULT" != success; then
            state=fail; status=REJECTED; failure=PROVIDER_ERROR
            recovery="Inspect provider health and governed request telemetry in run $GITHUB_RUN_ID; do not publish or retry automatically."
          elif test "$AGGREGATION_RESULT" != success; then
            state=fail; status=REJECTED; failure=COVERAGE_COLLAPSE
            recovery="Inspect coverage and freshness artifacts in run $GITHUB_RUN_ID; retain the last valid snapshot."
          elif test "$PUBLICATION_RESULT" != success; then
            state=fail; status=REJECTED; failure=PUBLICATION_REJECTED
            recovery="Inspect run $GITHUB_RUN_ID, preserve the last valid snapshot, and use controlled recovery only after root-cause review."
          else
            state=fail; status=REJECTED; failure=UNKNOWN_FAILURE
            recovery="Inspect all mandatory job results in run $GITHUB_RUN_ID; preserve the last valid snapshot."
          fi
          python scripts/send_operational_heartbeat.py \
            --operation DAILY_BUY_NOW --state "$state" \
            --run-id "$GITHUB_RUN_ID" --source-sha "$GITHUB_SHA" \
            --trading-session "${{ needs.post-close-coordinator.outputs.finalized_session }}" \
            --publication-status "$status" --failure-code "$failure" \
            --recovery-action "$recovery" --url-env ATLAS_DAILY_BUY_NOW_CRONITOR_URL
