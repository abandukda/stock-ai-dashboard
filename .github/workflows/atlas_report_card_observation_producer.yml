name: ATLAS Report Card Observation Producer

# Intentionally dispatch-only until the owner authorizes live provider use.
# Proposed schedule after certification: 30 22 * * 1-5 (22:30 UTC), guarded by
# the governed XNYS calendar and finalized-session checks in the producer.
on:
  workflow_dispatch:
    inputs:
      market_evidence_run_id:
        description: Authorized run containing finalized governed market evidence
        required: true
        type: string
      market_evidence_artifact:
        description: Exact governed market-evidence artifact name
        required: true
        type: string
      horizon:
        description: Exact registered trading-session horizon
        required: true
        type: choice
        options: ["1", "5", "21", "63", "126", "252"]
      authorize_bundle_production:
        description: Explicit authorization to produce a zero-provider bundle
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: atlas-report-card-observation-producer
  cancel-in-progress: false

jobs:
  produce:
    environment: atlas-internal-report-card
    runs-on: [self-hosted, Linux, X64, atlas-worker-1]
    timeout-minutes: 15
    env:
      ATLAS_REPORT_CARD_DURABLE_ROOT: ${{ vars.ATLAS_REPORT_CARD_DURABLE_ROOT }}
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit zero-provider production authorization
        shell: bash
        run: |
          test "${{ inputs.authorize_bundle_production }}" = "true"
          test -n "$ATLAS_REPORT_CARD_DURABLE_ROOT"
      - name: Download exact authorized market evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.market_evidence_run_id }}
          name: ${{ inputs.market_evidence_artifact }}
          path: audit_results/report_card_market_evidence
      - name: Resolve exactly one governed evidence snapshot
        id: evidence
        shell: bash
        run: |
          mapfile -t files < <(find audit_results/report_card_market_evidence -type f -name report_card_market_evidence.json)
          test "${#files[@]}" -eq 1
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
      - name: Produce deterministic observation bundle
        shell: bash
        run: |
          python3 scripts/build_report_card_observations.py \
            --ledger "$ATLAS_REPORT_CARD_DURABLE_ROOT/report-card.sqlite3" \
            --market-evidence "${{ steps.evidence.outputs.path }}" \
            --horizon "${{ inputs.horizon }}" \
            --output audit_results/report_card_observation/report_card_observations.json
      - name: Offline contract regression
        shell: bash
        run: pytest -q tests/test_report_card_observation_producer.py tests/test_report_card_observation_activation.py
      - name: Fail closed without retry
        if: failure()
        run: echo "::error title=ATLAS observation production failed::No retry, provider call, or ledger append was attempted."
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: atlas-report-card-observation-bundle-${{ github.run_id }}
          path: audit_results/report_card_observation/report_card_observations.json
          retention-days: 30
