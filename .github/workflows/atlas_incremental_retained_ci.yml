name: ATLAS Incremental Retained Evidence Offline CI

on:
  pull_request:
    paths:
      - services/incremental_provider_free_replay.py
      - services/buy_now_backfill_certification.py
      - services/buy_now_history_backfill_execution.py
      - services/buy_now_history_continuity.py
      - tests/test_buy_now_backfill_certification.py
      - tests/test_buy_now_history_backfill_execution.py
      - tests/test_buy_now_history_continuity.py
      - tests/test_finnhub_incremental_post_close.py
      - .github/workflows/atlas_incremental_retained_ci.yml

permissions:
  contents: read

jobs:
  retained-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify bounded source resolution and certification regression
        run: >-
          python -m pytest -q
          tests/test_finnhub_incremental_post_close.py
          tests/test_buy_now_backfill_certification.py
          tests/test_buy_now_history_backfill_execution.py
          tests/test_buy_now_history_continuity.py
          tests/test_incremental_publication_bridge.py
