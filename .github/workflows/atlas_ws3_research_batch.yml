name: ATLAS WS3 Protected Research Batch

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable evidence-source SHA
        required: true
        type: string
      batch_id:
        description: Exact registered WS3 batch ID
        required: true
        type: string
      authorization_token:
        description: Exact owner-issued manifest authorization token
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: atlas-ws3-protected-research-batch
  cancel-in-progress: false

jobs:
  acquire:
    environment: atlas-licensed-research-acquisition
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify registered runner and exact bounded package
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BATCH_ID: ${{ inputs.batch_id }}
          AUTHORIZATION_TOKEN: ${{ inputs.authorization_token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$BATCH_ID" = "WS3-B0001"
          test -n "$FINNHUB_API_KEY"
          python -m pip install --disable-pip-version-check requests==2.32.3
          python scripts/run_ws3_batch.py \
            --package output/joint/ws3_expansion/WS3-B0001-approval.json \
            --output audit_results/ws3-b0001 \
            --source-sha "$SOURCE_SHA" \
            --authorization-token "$AUTHORIZATION_TOKEN"
      - name: Upload raw-first evidence and sanitized telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-ws3-b0001-${{ github.run_id }}
          path: audit_results/ws3-b0001
          if-no-files-found: error
          retention-days: 30
