name: ATLAS Report Card Retained Evidence Inventory

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Exact reviewed main commit for provider-free read-only inventory
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: atlas-report-card-retained-inventory
  cancel-in-progress: false

jobs:
  inventory:
    environment: atlas-internal-report-card
    runs-on: [self-hosted, Linux, X64, atlas-worker-1]
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
      REVIEWED_SHA: ${{ inputs.candidate_ref }}
      FINNHUB_API_KEY: ""
      FMP_API_KEY: ""
      OPENAI_API_KEY: ""
      NEWSAPI_KEY: ""
      ALPHA_VANTAGE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Enforce reviewed main and existing protected runner
        run: |
          test "${{ runner.name }}" = atlas-worker-1
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$FINNHUB_API_KEY$FMP_API_KEY$OPENAI_API_KEY$NEWSAPI_KEY$ALPHA_VANTAGE_API_KEY"
          test -f /mnt/atlas_report_card_primary/report-card.sqlite3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Retrieve immutable original retained acquisition plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/12069093114/zip" \
            --output "$RUNNER_TEMP/report-card-retained-plan.zip"
          echo "c898793aeb379bb5aad1a2b1fdc568692d8562f96d53a20c081f4dd3243135dd  $RUNNER_TEMP/report-card-retained-plan.zip" | sha256sum --check
          python -m zipfile -e "$RUNNER_TEMP/report-card-retained-plan.zip" "$RUNNER_TEMP/report-card-retained-plan"
      - name: Inventory original cohort and retained envelopes without writes
        run: >-
          python scripts/inventory_report_card_retained_evidence.py
          --ledger /mnt/atlas_report_card_primary/report-card.sqlite3
          --package "$RUNNER_TEMP/report-card-retained-plan/history_backfill_package.json"
          --original /mnt/atlas_incremental_raw/history_backfill/oct02-oct15-2026-backfill-38962431540-01
          --recovery /mnt/atlas_incremental_raw/history_backfill_recovery/oct02-oct15-2026-backfill-recovery-38987831148-01
          --output audit_results/report_card_retained_inventory/inventory.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-report-card-retained-inventory-${{ github.run_id }}
          path: audit_results/report_card_retained_inventory
          if-no-files-found: warn
