name: ATLAS Runner Routing Offline CI
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/contabo_smoke_once.sh'
      - 'tests/test_runner_routing_security.py'
      - 'tests/test_full_qa_split_handoff.py'
      - 'tests/test_full_qa_pipeline.py'
      - 'docs/ATLAS_CONTABO_SMOKE_RUNBOOK.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-routing-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3 pytest==9.1.1
      - name: Enforce routing and negative-case startup guard contracts
        run: python3 -m unittest discover -s tests -p test_runner_routing_security.py -v
      - name: Preserve full QA split and finalization contracts
        run: python3 -m pytest -q tests/test_full_qa_pipeline.py tests/test_full_qa_split_handoff.py
      - name: Validate consolidated host commands
        run: bash -n scripts/contabo_smoke_once.sh
