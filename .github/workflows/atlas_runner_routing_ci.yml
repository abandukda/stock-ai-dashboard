name: ATLAS Runner Routing Offline CI
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - 'scripts/contabo_smoke_once.sh'
      - 'scripts/contabo_rehearsal_once.sh'
      - 'scripts/contabo_certification_rehearsal.py'
      - 'tests/test_contabo_rehearsal.py'
      - 'tests/test_post_merge_production_verify.py'
      - 'scripts/wait_for_production_source.py'
      - 'services/customer_navigation_contract.py'
      - 'tests/test_customer_nav_geometry.py'
      - 'app.py'
      - 'tests/test_runner_routing_security.py'
      - 'services/annotated_research_chart.py'
      - 'ui/internal_report_card.py'
      - 'ui/research_report_v2.py'
      - 'tests/test_annotated_chart_render.py'
      - 'services/customer_navigation_styles.py'
      - 'services/customer_navigation_contract.py'
      - 'tests/test_post_merge_production_verify.py'
      - 'tests/test_customer_nav_geometry.py'
      - 'tests/test_full_qa_split_handoff.py'
      - 'tests/test_full_qa_pipeline.py'
      - 'docs/ATLAS_CONTABO_SMOKE_RUNBOOK.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-routing-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3 pytest==9.1.1
      - name: Validate smoke and routing workflow expressions with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          lint_dir=$(mktemp -d "$RUNNER_TEMP/atlas-actionlint.XXXXXXXX")
          trap 'rm -rf "$lint_dir"' EXIT
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$lint_dir/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$lint_dir/actionlint.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf "$lint_dir/actionlint.tar.gz" -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -shellcheck= -pyflakes= \
            .github/workflows/atlas_contabo_provider_free_smoke.yml \
            .github/workflows/atlas_runner_routing_ci.yml \
            .github/workflows/atlas_contabo_certification_rehearsal.yml \
            .github/workflows/atlas_post_merge_production_verify.yml
      - name: Verify production propagation and credential boundaries
        run: python3 -m pytest -q tests/test_post_merge_production_verify.py
      - name: Enforce routing and negative-case startup guard contracts
        run: python3 -m unittest discover -s tests -p test_runner_routing_security.py -v
      - name: Preserve full QA split and finalization contracts
        run: python3 -m pytest -q tests/test_full_qa_pipeline.py tests/test_full_qa_split_handoff.py
      - name: Verify generated fixture recovery and rehearsal guards
        run: python3 -m unittest discover -s tests -p test_contabo_rehearsal.py -v
      - name: Profile full generated fixture rehearsal without protected inputs
        env:
          ATLAS_QA_PROVIDER_CALLS_ALLOWED: '0'
          ATLAS_ALLOW_EXTERNAL_AI: 'false'
          ATLAS_CUSTOMER_REPORT_CARD_ENABLED: 'false'
        run: python3 scripts/contabo_certification_rehearsal.py --source-sha "$GITHUB_SHA"
      - name: Validate consolidated host commands
        run: bash -n scripts/contabo_smoke_once.sh scripts/contabo_rehearsal_once.sh
  customer-navigation-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.52.0 plotly==6.7.0
      - run: python -m playwright install --with-deps chromium
      - name: Require all four customer labels inside viewport
        run: python -m unittest discover -s tests -p test_customer_nav_geometry.py -v
      - name: Render educational chart at desktop tablet and mobile
        run: python -m unittest discover -s tests -p test_annotated_chart_render.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-educational-chart-preview-${{ github.run_id }}
          path: audit_results/annotated_chart
          if-no-files-found: error
          retention-days: 14
