name: ATLAS Transcript Authorization Offline CI

on:
  pull_request:
    paths:
      - services/transcript_intelligence_runtime.py
      - services/transcript_provider.py
      - services/transcript_evidence_store.py
      - tests/test_transcript_source_revisions.py
      - services/transcript_cache_reader.py
      - tests/test_transcript_cache_reader.py
      - tests/test_transcript_evidence_store.py
      - scripts/earnings_transcript_live_qa.py
      - tests/test_transcript_intelligence_runtime.py
      - .github/workflows/atlas_transcript_offline_ci.yml

permissions:
  contents: read

jobs:
  offline-approval-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest PyYAML==6.0.3
      - name: Verify transcript approval, grounding and license gates with stubs
        run: >-
          python -m pytest -q
          tests/test_transcript_intelligence_runtime.py
          tests/test_transcript_provider_contract.py
          tests/test_transcript_evidence_store.py
          tests/test_transcript_source_revisions.py
          tests/test_transcript_cache_reader.py
          tests/test_atlas_vnext_earnings.py
          tests/test_earnings_transcript_workflow.py
          tests/test_provider_family_boundary_adversarial.py
