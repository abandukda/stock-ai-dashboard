name: Atlas Runtime QA

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "QA execution mode"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - targeted_preflight
          - visual_crawl

  schedule:
    - cron: "30 11 * * 1-5"
    - cron: "30 23 * * 1-5"

jobs:
  runtime-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-runtime-qa.txt

      - name: Verify QA source
        run: |
          test -f requirements-runtime-qa.txt
          test -f agents/atlas_runtime_qa_v3.py
          test -f agents/ai_content_integrity_v3.py
          test -f agents/code_contract_mapper_v3.py
          test -f agents/fix_planner_v3.py
          test -f agents/qa_v3_models.py
          test -f agents/atlas_visual_crawler_v1.py

      - name: Record source and verify architecture
        run: |
          mkdir -p audit_results
          git rev-parse HEAD | tee audit_results/source_commit.txt
          python -m agents.runtime_qa_architecture \
            --preflight \
            --output audit_results/architecture_preflight.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime-qa.txt
          python -c "from PIL import Image; assert Image is not None"

      - name: Install and verify Chromium
        timeout-minutes: 8
        run: |
          python -m playwright install chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_content("<title>ATLAS Runtime QA browser ready</title>")
              assert page.title() == "ATLAS Runtime QA browser ready"
              browser.close()
          PY

      - name: Run Atlas Runtime QA
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'visual_crawl' }}
        env:
          ATLAS_AUDIT_PASSWORD: ${{ secrets.ATLAS_AUDIT_PASSWORD }}
          ATLAS_QA_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u -m agents.atlas_runtime_qa_v3 \
            --url https://stock-ai-dashboard.streamlit.app \
            --output audit_results \
            --mode "$ATLAS_QA_MODE"

      - name: Run non-blocking Atlas Visual Crawler
        id: visual_crawl
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'visual_crawl' }}
        continue-on-error: true
        env:
          ATLAS_AUDIT_PASSWORD: ${{ secrets.ATLAS_AUDIT_PASSWORD }}
          ATLAS_QA_MODE: visual_crawl
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p audit_results/visual_crawl
          python - <<'PY'
          import json
          from pathlib import Path

          Path("audit_results/visual_crawl/visual_crawler_step_status.json").write_text(
              json.dumps({
                  "status": "VISUAL_CRAWLER_EXECUTION_DEFECT",
                  "phase": "INITIALIZED",
                  "crawler_exit_code": None,
                  "summary_present": False,
              }, indent=2),
              encoding="utf-8",
          )
          PY
          set +e
          python -u -m agents.atlas_visual_crawler_v1 \
            --url https://stock-ai-dashboard.streamlit.app \
            --output audit_results/visual_crawl
          crawler_exit_code=$?
          set -e
          CRAWLER_EXIT_CODE="$crawler_exit_code" python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("audit_results/visual_crawl")
          summary_path = output / "atlas_visual_qa_summary.json"
          required = (
              "atlas_visual_qa_summary.json",
              "atlas_visual_qa_matrix.csv",
              "screenshot_manifest.json",
              "atlas_visual_qa_summary.md",
              "atlas_visual_qa_summary.html",
              "screenshots",
          )
          exit_code = int(os.environ["CRAWLER_EXIT_CODE"])
          missing = [name for name in required if not (output / name).exists()]
          status = "VISUAL_CRAWLER_EXECUTION_DEFECT"
          finished = False
          failures = None
          if summary_path.exists() and exit_code in {0, 2}:
              try:
                  report = json.loads(summary_path.read_text(encoding="utf-8"))
                  finished = bool(report.get("finished"))
                  failures = int(((report.get("counts") or {}).get("all") or {}).get("failed", 0))
                  if missing or not finished:
                      status = "VISUAL_CRAWLER_ARTIFACT_DEFECT"
                  else:
                      status = "VISUAL_CERTIFICATION_FAIL" if failures else "VISUAL_CERTIFICATION_PASS"
              except (OSError, ValueError, TypeError):
                  status = "VISUAL_CRAWLER_ARTIFACT_DEFECT"
          elif summary_path.exists():
              status = "VISUAL_CRAWLER_EXECUTION_DEFECT"
          record = {
              "status": status,
              "phase": "CRAWLER_FINISHED",
              "crawler_exit_code": exit_code,
              "summary_present": summary_path.exists(),
              "finished": finished,
              "failure_count": failures,
              "missing_artifacts": missing,
          }
          (output / "visual_crawler_step_status.json").write_text(
              json.dumps(record, indent=2), encoding="utf-8"
          )
          print(json.dumps(record, sort_keys=True))
          PY

      - name: Summarize Visual Crawler certification
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'visual_crawl' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("audit_results/visual_crawl/atlas_visual_qa_summary.json")
          status_path = Path("audit_results/visual_crawl/visual_crawler_step_status.json")
          if not status_path.exists():
              print("VISUAL_CRAWLER_EXECUTION_DEFECT")
              print("Visual crawler execution status is missing.")
              raise SystemExit(0)
          execution = json.loads(status_path.read_text(encoding="utf-8"))
          infrastructure_status = execution.get("status")
          if not path.exists():
              print(infrastructure_status or "VISUAL_CRAWLER_EXECUTION_DEFECT")
              print("Visual crawler summary is missing; product certification was not evaluated.")
              raise SystemExit(0)
          report = json.loads(path.read_text(encoding="utf-8"))
          counts = report.get("counts") or {}
          pages = counts.get("pages") or {}
          interactions = counts.get("interactions") or {}
          research = counts.get("research_tickers") or {}
          tabs = counts.get("tabs") or {}
          shots = counts.get("screenshots") or {}
          defects = report.get("defects") or []
          severity = {
              label: sum(item.get("severity") == label for item in defects)
              for label in ("P1", "P2", "P3")
          }
          failed = bool((counts.get("all") or {}).get("failed", 0))
          status = str(infrastructure_status or ("VISUAL_CERTIFICATION_FAIL" if failed else "VISUAL_CERTIFICATION_PASS"))
          lines = [
              status,
              f"pages: {pages.get('passed', 0)}/{pages.get('attempted', 0)}",
              f"interactions: {interactions.get('passed', 0)}/{interactions.get('attempted', 0)}",
              f"Research tickers: {research.get('passed', 0)}/{research.get('attempted', 0)}",
              f"tabs: {tabs.get('passed', 0)}/{tabs.get('attempted', 0)}",
              f"screenshots: {shots.get('generated', 0)}/{shots.get('expected', 0)}",
              f"defects: P1={severity['P1']} P2={severity['P2']} P3={severity['P3']}",
              "artifact: audit_results/visual_crawl",
          ]
          print("\n".join(lines))
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("## ATLAS Visual Crawler V1\n\n")
                  handle.write("\n\n".join(lines) + "\n")
          PY

      - name: Upload QA Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-runtime-qa-v3
          path: audit_results
          if-no-files-found: warn
          retention-days: 14

      - name: Set Visual Crawler certification result
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'visual_crawl' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("audit_results/visual_crawl/atlas_visual_qa_summary.json")
          status_path = Path("audit_results/visual_crawl/visual_crawler_step_status.json")
          if not status_path.exists():
              print("VISUAL_CRAWLER_EXECUTION_DEFECT: execution status missing")
              raise SystemExit(1)
          execution = json.loads(status_path.read_text(encoding="utf-8"))
          status = execution.get("status")
          if status in {"VISUAL_CRAWLER_EXECUTION_DEFECT", "VISUAL_CRAWLER_ARTIFACT_DEFECT"}:
              print(f"{status}: exit={execution.get('crawler_exit_code')} summary={execution.get('summary_present')}")
              raise SystemExit(1)
          if not path.exists():
              print("VISUAL_CRAWLER_ARTIFACT_DEFECT: summary artifact missing")
              raise SystemExit(1)
          report = json.loads(path.read_text(encoding="utf-8"))
          failed = int(((report.get("counts") or {}).get("all") or {}).get("failed", 0))
          finished = bool(report.get("finished"))
          if status == "VISUAL_CERTIFICATION_FAIL" or failed or not finished:
              print(f"VISUAL_CERTIFICATION_FAIL: failures={failed} finished={finished}")
              raise SystemExit(1)
          if status != "VISUAL_CERTIFICATION_PASS":
              print(f"VISUAL_CRAWLER_ARTIFACT_DEFECT: unexpected status={status}")
              raise SystemExit(1)
          print(status)
          PY
