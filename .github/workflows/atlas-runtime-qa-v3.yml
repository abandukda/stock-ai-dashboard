name: Atlas Runtime QA

on:
  workflow_dispatch:

  schedule:
    # Every weekday at 7:30 AM Eastern (adjust if desired)
    - cron: "30 11 * * 1-5"

    # Every weekday at 7:30 PM Eastern (adjust if desired)
    - cron: "30 23 * * 1-5"

jobs:
  runtime-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime-qa.txt
          python -m playwright install chromium

      - name: Run Atlas Runtime QA
        env:
          ATLAS_AUDIT_PASSWORD: ${{ secrets.ATLAS_AUDIT_PASSWORD }}
        run: |
          python -m agents.atlas_runtime_qa_v2 \
            --url https://stock-ai-dashboard.streamlit.app \
            --output audit_results

      - name: Upload QA Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-runtime-qa
          path: audit_results